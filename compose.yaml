# 로컬 개발용 DB. 앱 실행 시 spring-boot-docker-compose가 자동으로 띄운다.
# - 포트는 127.0.0.1(내 컴퓨터)에만 열어서, 같은 와이파이의 다른 기기는 접속할 수 없게 한다
#   (저장소가 public이라 아래 계정·비밀번호가 공개돼 있음)
# - healthcheck가 있으면 spring-boot-docker-compose가 healthy가 될 때까지 기다린 뒤 앱을 띄운다
services:
  mongodb:
    image: 'mongo:7' # latest는 최신 커널과 호환 문제가 있어 CI(ci.yml)와 동일하게 버전 고정
    environment:
      - 'MONGO_INITDB_DATABASE=monew'
      - 'MONGO_INITDB_ROOT_PASSWORD=secret'
      - 'MONGO_INITDB_ROOT_USERNAME=root'
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - monew-mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
  postgres:
    image: 'postgres:16' # 실제 RDS(monew-postgres) 버전이 16이라, 로컬/배포 버전을 통일하기 위해 고정
    environment:
      - 'POSTGRES_DB=monew'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=monew_user'
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - monew-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'monew_user', '-d', 'monew']
      interval: 5s
      timeout: 5s
      retries: 10

# 이름 있는 볼륨: docker compose down 후 up 해도 로컬 데이터가 남는다
# DB를 완전히 새로 시작하려면 docker compose down -v
volumes:
  monew-postgres-data:
  monew-mongo-data:
