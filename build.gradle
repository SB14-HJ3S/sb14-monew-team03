import org.w3c.dom.Node
import org.xml.sax.InputSource

import javax.xml.parsers.DocumentBuilderFactory
import javax.xml.transform.OutputKeys
import javax.xml.transform.TransformerFactory
import javax.xml.transform.dom.DOMSource
import javax.xml.transform.stream.StreamResult
import java.nio.file.Files
import java.nio.file.StandardCopyOption

plugins {
  // 코드 스타일 자동 정리 (google-java-format 기준)
  id 'com.diffplug.spotless' version '8.6.0'

  id 'java'
  id 'jacoco'
  id 'checkstyle'   // Spotless가 못 잡는 코드 품질 문제(안 쓰는 import, 빈 catch 블록 등) 경고용
  id 'org.springframework.boot' version '3.5.16'
  id 'io.spring.dependency-management' version '1.1.7'
}

jacoco {
  toolVersion = '0.8.12'
}

// 코드 스타일 설정
spotless {
  enforceCheck = false   // ./gradlew build 시 스타일 위반해도 빌드 실패하지 않음
  java {
    googleJavaFormat().aosp()   // 구글 코드 스타일 + 들여쓰기 4칸 (aosp를 안 붙이면 2칸)
  }
}

// 코드 품질 경고 (Spotless가 못 잡는 것들: 안 쓰는 import, 빈 catch 블록, 중괄호 생략, 매직 넘버 등)
// 규칙은 구글 공식 규칙 그대로 (config/checkstyle/checkstyle.xml)
// 위반이 있어도 빌드는 안 막힘 — PR의 Checks 탭에 경고로만 보여 줌 (ci.yml)
checkstyle {
  toolVersion = '10.26.1'
  configFile = file("${rootDir}/config/checkstyle/checkstyle.xml")
}

tasks.withType(Checkstyle).configureEach {
  ignoreFailures = true
  reports {
    xml.required = true    // reviewdog가 PR 코멘트 생성할 때 읽는 용도
    html.required = true   // 사람이 브라우저로 보는 용 (build/reports/checkstyle)
  }
}

group = 'com.sprint'
version = '0.0.1-SNAPSHOT'

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(17)
  }
}

// annotationProcessor에 넣은 의존성을 compileOnly에도 자동으로 포함시켜줌
configurations {
  compileOnly {
    extendsFrom annotationProcessor
  }
}

repositories {
  mavenCentral()
}

dependencies {
  // ── String Similarity Utils  ──────────────────────
  implementation 'org.apache.commons:commons-text:1.15.0'

  // ── Web & Validation ──────────────────────────────
  implementation 'org.springframework.boot:spring-boot-starter-web'
  implementation 'org.springframework.boot:spring-boot-starter-validation'

  // ── Database & JPA ────────────────────────────────
  // 로컬은 compose.yaml의 Postgres, 테스트는 Testcontainers Postgres를 써서 H2는 쓰지 않음
  implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
  runtimeOnly 'org.postgresql:postgresql'

  // ── MongoDB (활동내역 조회 모델, 심화) ────────────────
  implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'

  // ── Batch (심화 요구사항) ─────────────────────────────
  implementation 'org.springframework.boot:spring-boot-starter-batch'
  implementation 'org.springframework.boot:spring-boot-starter-aop'               // 모든 @Scheduled에 잠금을 거는 Aspect용
  implementation 'net.javacrumbs.shedlock:shedlock-provider-jdbc-template:6.10.0' // 배치 중복 실행 방지 (shedlock 표)

  // ── 모니터링 ───────────────────────────────────────
  implementation 'org.springframework.boot:spring-boot-starter-actuator'  // /actuator/health 등 서버 상태 확인
  implementation 'io.micrometer:micrometer-registry-prometheus'
  // /actuator/prometheus로 Prometheus가 읽을 수 있는 지표 노출

  // ── Swagger (API 문서 자동 생성) ─────────────────────
  implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'

  // ── 비밀번호 해싱 (회원가입/로그인용, Security 스타터 전체는 불필요) ──
  implementation 'org.springframework.security:spring-security-crypto'

  // ── ROME (ROME -> 객체 파싱 라이브러리) ─────────────────────
  implementation 'com.rometools:rome:2.1.0'

  // ── JSOUP (HTML 태그 정제 라이브러리) ─────────────────────
  implementation 'org.jsoup:jsoup:1.18.3'

  // ── 로컬 개발 편의 도구 (배포 시엔 빠짐) ────────────
  developmentOnly 'org.springframework.boot:spring-boot-devtools'          // 코드 변경 시 자동 재시작
  developmentOnly 'org.springframework.boot:spring-boot-docker-compose'    // 로컬 실행 시 compose.yaml 자동 인식

  // ── Lombok ────────────────────────────────────────
  compileOnly 'org.projectlombok:lombok'
  annotationProcessor 'org.projectlombok:lombok'

  // ── AWS S3 (뉴스 기사 날짜별 백업, 심화 로그 적재) ──────
  // AWS 공식 설치 방식(BOM) — 다른 AWS 모듈을 추가해도 버전이 자동으로 맞춰짐
  implementation platform('software.amazon.awssdk:bom:2.55.12')
  implementation 'software.amazon.awssdk:s3'

  // ── QueryDSL (동적 쿼리 + 커서 페이지네이션용) ────────
  implementation 'io.github.openfeign.querydsl:querydsl-core:6.10.1'
  implementation 'io.github.openfeign.querydsl:querydsl-jpa:6.10.1'
  annotationProcessor 'io.github.openfeign.querydsl:querydsl-apt:6.10.1:jpa'

  // ── Test ──────────────────────────────────────────
  testImplementation 'org.springframework.boot:spring-boot-starter-test'
  testCompileOnly 'org.projectlombok:lombok'
  testAnnotationProcessor 'org.projectlombok:lombok'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'  // Gradle에서 JUnit5 실행에 필요
  // H2 대신 실제 Postgres로 테스트 — "로컬 테스트는 통과했는데 운영에서 실패"하는 걸 방지
  testImplementation 'org.springframework.boot:spring-boot-testcontainers'
  testImplementation 'org.testcontainers:junit-jupiter'
  testImplementation 'org.testcontainers:postgresql'
  testImplementation 'org.testcontainers:mongodb'  // Mongo도 가짜 대신 실제 컨테이너로 테스트
  testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'
}

tasks.named('test') {
  // 실제 외부 서비스(네이버 API·RSS·S3)를 부르는 테스트는 @Tag("external-api")를 붙여 평소 테스트·CI에서 제외
  // — 외부 장애·호출 한도·CI에 키 없음 같은 외부 사정으로 CI가 실패하지 않게
  useJUnitPlatform {
    excludeTags 'external-api', 'architecture'
  }
  // GitHub Actions 서버는 UTC라, 날짜를 계산하는 테스트가 로컬(한국 시간)과 다르게 동작하지 않도록 고정
  jvmArgs '-Duser.timezone=Asia/Seoul'
  // 메인 application.yaml 위에 application-test.yaml만 덮어쓰도록 test 프로파일을 켠다
  systemProperty 'spring.profiles.active', 'test'
  finalizedBy jacocoTestReport   // 테스트 끝나면 바로 커버리지 리포트 생성
}

tasks.register('archTest', Test) {
  description = '패키지 규칙 테스트(@Tag("architecture"))만 실행합니다. 위반이 있어도 빌드는 실패하지 않습니다.'
  group = 'verification'
  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath
  useJUnitPlatform {
    includeTags 'architecture'
  }
  ignoreFailures = true
}

// 외부 호출 테스트(@Tag("external-api"))만 따로 실행: ./gradlew externalTest (로컬 .env에 키 필요)
tasks.register('externalTest', Test) {
  description = '실제 외부 서비스를 호출하는 테스트(@Tag("external-api"))만 실행합니다.'
  group = 'verification'
  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath
  useJUnitPlatform {
    includeTags 'external-api'
  }
  jvmArgs '-Duser.timezone=Asia/Seoul'
  systemProperty 'spring.profiles.active', 'test' // test 작업과 같음
  // 로컬 .env 값을 이 작업에서만 환경변수로 넣어 줌 — 평소 test 작업·CI는 .env를 읽지 않음
  doFirst {
    def envFile = rootProject.file('.env')
    if (envFile.exists()) {
      envFile.eachLine { line ->
        def entry = line.trim()
        if (entry && !entry.startsWith('#') && entry.contains('=')) {
          def idx = entry.indexOf('=')
          environment entry.substring(0, idx).trim(), entry.substring(idx + 1).trim()
        }
      }
    }
  }
}

// 테스트할 로직이 없는 코드는 커버리지 계산에서 제외 (DTO, 설정 클래스, 메인 클래스, 자동 생성 코드)
def jacocoExcludes = [
  '**/dto/**',               // DTO(record): 필드만 담는 그릇, 테스트할 로직 없음
  '**/config/**',            // 설정 클래스: 빈 등록만 함
  '**/MonewApplication.class', // 메인 클래스: main()뿐
  '**/event/*Event.class',
  // 공통 코드: 테스트는 각자 자기 도메인만 짜기로 해서, 커버리지를 도메인 코드만으로 계산
  '**/global/**',
  // QueryDSL이 자동 생성하는 Q클래스 — 그냥 'Q*'로 쓰면 QuestionService 같은 클래스까지 빠져서 entity 경로로 한정
  // 주의: entity 패키지에 Q로 시작하는 진짜 엔티티(예: QuizResult)를 만들면 같이 빠지니 그런 이름은 피할 것
  '**/entity/Q*.class',
]

def jacocoIncludes = [
  '**/global/util/similarity/StringSimilarityUtils*.class',
  '**/global/web/RequestIdInterceptor*.class',
]

jacocoTestReport {
  dependsOn test
  reports {
    xml.required = true    // Codecov 업로드용
    html.required = true   // 사람이 브라우저로 보는 용 (build/reports/jacoco)
    csv.required = false   // 커버리지 표시는 Codecov 수치로 통일
  }
  afterEvaluate {
    classDirectories.setFrom(files(classDirectories.files.collect {
      [fileTree(dir: it, exclude: jacocoExcludes), fileTree(dir: it, include: jacocoIncludes)]
    }))
  }
}

// 테스트 커버리지 최소 기준 검사. 지금은 0%(막지 않음) — 나중에 숫자만 올리면 됨(예: 0.8 = 80%)
// `check`에 연결돼 있어 `./gradlew build`에 자동 포함됨
jacocoTestCoverageVerification {
  dependsOn jacocoTestReport
  afterEvaluate {
    classDirectories.setFrom(files(classDirectories.files.collect {
      [fileTree(dir: it, exclude: jacocoExcludes), fileTree(dir: it, include: jacocoIncludes)]
    }))
  }
  violationRules {
    rule {
      limit {
        // 줄(LINE) 기준: Codecov 배지와 같은 기준
        counter = 'LINE'
        value = 'COVEREDRATIO'
        minimum = 0.0
      }
    }
  }
}

check.dependsOn jacocoTestCoverageVerification

// 팀원 클론 시 pre-commit/commit-msg/prepare-commit-msg/pre-push hook 자동 설치
// - pre-commit: 커밋 전 spotlessApply 자동 실행
// - commit-msg: 커밋 메시지 형식 검사 + 타입 단축키(f;·t1; 등) 변환 + 브랜치명의 이슈번호 [#번호] 자동 삽입
//   + Git이 영어로 만드는 머지·되돌리기 제목 변환
// - prepare-commit-msg: commit-msg를 안 거치는 git revert도 제목이 변환되게 commit-msg를 미리 실행
// - pre-push: push 전 포맷 검사·본 코드 컴파일만 자동 실행, 테스트 컴파일·실행은 CI가 담당
tasks.register('installGitHooks', Copy) {
  description = '팀원 클론 시 pre-commit/commit-msg/prepare-commit-msg/pre-push hook을 자동으로 설치합니다.'
  from "$rootDir/scripts/pre-commit"
  from "$rootDir/.githooks/commit-msg"
  from "$rootDir/.githooks/prepare-commit-msg"
  from "$rootDir/.githooks/pre-push"
  into "$rootDir/.git/hooks"
  filePermissions {
    unix("0755")
  }
}

// 커밋 메시지 템플릿(.gitmessage.txt) 자동 설정
tasks.register('installGitMessageTemplate') {
  description = '커밋 메시지 템플릿을 자동으로 설정합니다.'
  doLast {
    ['git', 'config', 'commit.template', '.gitmessage.txt'].execute(null, rootDir).waitFor()
  }
}

// 팀원 클론 시 인텔리제이 코드 스타일(들여쓰기 4칸) 자동 설정
tasks.register('installIntellijCodeStyle', Copy) {
  description = '팀원 클론 시 인텔리제이 코드 스타일(들여쓰기 4칸)을 자동으로 설정합니다.'
  from "$rootDir/config/intellij/codeStyles"
  into "$rootDir/.idea/codeStyles"
}

// 저장 시 자동 포맷팅(Java 리포맷 + import 정리) 설정
// ⚠️ 자동 설치되지 않음 — 인텔리제이가 열려 있으면 workspace.xml을 덮어써서 설정이 사라질 수 있음
// 인텔리제이를 닫은 상태에서 `./gradlew installIntellijActionsOnSave`를 1회 실행
tasks.register('installIntellijActionsOnSave') {
  description = '저장 시 자동 리포맷 + import 정리를 설정합니다. 인텔리제이를 닫은 상태에서 실행하세요.'

  def settingsFile = rootProject.file('config/intellij/actionsOnSave.xml')
  def workspaceFile = rootProject.file('.idea/workspace.xml')
  inputs.file(settingsFile)
  // 인텔리제이가 workspace.xml의 다른 옵션을 바꿔놨을 수 있어서 매번 새로 병합

  doLast {
    def factory = DocumentBuilderFactory.newInstance()
    factory.setFeature('http://apache.org/xml/features/disallow-doctype-decl', true)
    def parser = factory.newDocumentBuilder()
    def settings = parser.parse(settingsFile)
    def original = workspaceFile.exists() ? workspaceFile.getText('UTF-8') : null
    def workspace = original != null
      ? parser.parse(new InputSource(new StringReader(original)))
      : parser.parse(new InputSource(new StringReader('<project version="4" />')))
    if (workspace.documentElement.tagName != 'project' || settings.documentElement.tagName != 'project') {
      throw new GradleException('인텔리제이 설정 파일의 루트 엘리먼트는 <project>여야 합니다.')
    }

    def elements = { node ->
      (0..<node.childNodes.length).collect { node.childNodes.item(it) }
        .findAll { it.nodeType == Node.ELEMENT_NODE }
    }
    elements(settings.documentElement).each { desiredComponent ->
      def component = elements(workspace.documentElement).find {
        it.tagName == 'component' && it.getAttribute('name') == desiredComponent.getAttribute('name')
      }
      if (component == null) {
        workspace.documentElement.appendChild(workspace.createTextNode('\n  '))
        workspace.documentElement.appendChild(workspace.importNode((Node) desiredComponent, true))
        workspace.documentElement.appendChild(workspace.createTextNode('\n'))
      } else {
        // 다른 컴포넌트/옵션(개인 workspace 설정 포함)은 그대로 보존
        elements(desiredComponent).each { desiredOption ->
          def existingOptions = elements(component).findAll {
            it.tagName == 'option' && it.getAttribute('name') == desiredOption.getAttribute('name')
          }
          def replacement = workspace.importNode((Node) desiredOption, true)
          if (existingOptions.empty) {
            component.appendChild(replacement)
          } else {
            component.replaceChild(replacement, existingOptions.first())
            existingOptions.drop(1).each { component.removeChild(it) }
          }
        }
      }
    }

    def transformer = TransformerFactory.newInstance().newTransformer()
    transformer.setOutputProperty(OutputKeys.ENCODING, 'UTF-8')
    transformer.setOutputProperty(OutputKeys.INDENT, 'no')
    def writer = new StringWriter()
    transformer.transform(new DOMSource(workspace), new StreamResult(writer))
    def updated = writer.toString()
    if (updated != original) {
      Files.createDirectories(workspaceFile.parentFile.toPath())
      def temporary = Files.createTempFile(workspaceFile.parentFile.toPath(), 'workspace-', '.xml')
      try {
        Files.writeString(temporary, updated)
        Files.move(temporary, workspaceFile.toPath(),
          StandardCopyOption.ATOMIC_MOVE, StandardCopyOption.REPLACE_EXISTING)
      } finally {
        Files.deleteIfExists(temporary)
      }
    }
    logger.lifecycle('인텔리제이 저장 시 자동 포맷 설정 완료: Java 리포맷(전체 파일) + import 정리')
  }
}

// build 실행 시에도 위 세 가지가 같이 적용되게 남겨둠 (수동으로 다시 설치하고 싶을 때 `./gradlew installGitHooks` 등으로 재실행 가능)
def isCI = System.getenv('CI') != null

if (!isCI) {
  tasks.named('build') {
    // git worktree에서는 .git/hooks가 없어서 건너뜀 (원본 클론에 이미 설치돼 있음)
    if (file("$rootDir/.git/hooks").exists()) {
      dependsOn tasks.named('installGitHooks')
    }
    dependsOn tasks.named('installGitMessageTemplate')
    dependsOn tasks.named('installIntellijCodeStyle')
  }
}

// 이 build.gradle이 읽히는 시점(인텔리제이가 프로젝트를 열 때 하는 Gradle sync 포함)에 바로 설치 —
// 팀원은 프로젝트를 열기만 해도 훅/코드 스타일이 깔림
// 단, 훅이 직접 실행한 Gradle(MONEW_GIT_HOOK=1)에서는 복사하지 않음 — 실행 중인 훅 파일을 덮어쓰면 커밋이 막힘
def runFromGitHook = System.getenv('MONEW_GIT_HOOK') != null
if (!runFromGitHook && file("$rootDir/.git/hooks").exists()) {
  copy {
    from "$rootDir/scripts/pre-commit"
    from "$rootDir/.githooks/commit-msg"
    from "$rootDir/.githooks/prepare-commit-msg"
    from "$rootDir/.githooks/pre-push"
    into "$rootDir/.git/hooks"
    filePermissions {
      unix("0755")
    }
  }
  ['git', 'config', 'commit.template', '.gitmessage.txt'].execute(null, rootDir).waitFor()
  if (!isCI && file("$rootDir/.git/hooks").exists()) {
    copy {
      from "$rootDir/config/intellij/codeStyles"
      into "$rootDir/.idea/codeStyles"
    }
  }
}
