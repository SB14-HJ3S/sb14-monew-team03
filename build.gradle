plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.sprint'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// ── Web & Validation ──────────────────────────────
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// ── Database & JPA ────────────────────────────────
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	runtimeOnly 'com.h2database:h2'          // 테스트/로컬 개발용 DB
	runtimeOnly 'org.postgresql:postgresql'  // 실제 운영 DB

	// ── MongoDB (활동내역 조회 모델, 심화) ────────────────
	implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'

	// ── Batch (심화 요구사항) ─────────────────────────────
	implementation 'org.springframework.boot:spring-boot-starter-batch'

	// ── 모니터링 ───────────────────────────────────────
	implementation 'org.springframework.boot:spring-boot-starter-actuator'  // /actuator/health 등 서버 상태 확인

	// ── 비밀번호 해싱 (회원가입/로그인용, Security 스타터 전체는 불필요) ──
	implementation 'org.springframework.security:spring-security-crypto'

	// ── 로컬 개발 편의 도구 (배포 시엔 빠짐) ────────────
	developmentOnly 'org.springframework.boot:spring-boot-devtools'          // 코드 변경 시 자동 재시작
	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'    // 로컬 실행 시 compose.yaml 자동 인식

	// ── Lombok ────────────────────────────────────────
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// ── Test ──────────────────────────────────────────
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'  // Gradle에서 JUnit5 실행에 필요
}

tasks.named('test') {
	useJUnitPlatform()
}
