language: ko-KR
tone_instructions: "지적은 무엇이 문제인지, 왜 문제인지, 어떻게 고치면 되는지 순으로 간단히 적는다. 근거를 코드에서 찾지 못한 내용은 확인을 요청하는 질문으로 남긴다. 리뷰 범위는 이 PR의 변경 부분으로 한정한다."

reviews:
  profile: assertive

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - ".*"

  high_level_summary: false

  path_filters:
    - "!**/build/**"
    - "!**/.gradle/**"
    - "!**/*.class"
    - "!out/**"
    - "!**/node_modules/**"
    - "!src/main/resources/static/**"

  path_instructions:
    - path: "**"
      instructions: >
        이전 리뷰에서 지적했는데 아직 안 고쳐진 것은 필수·권장·선택 모두 고쳐질 때까지 추적하되,
        같은 설명을 다시 길게 쓰지 말고 한 줄로만 남겨 주세요.
        PR 본문에 일부러 빼거나 다르게 한 이유가 근거(Swagger·CLAUDE.md·요구사항)와 함께 적힌 항목은 바로 문제로 지적하지 마세요.
        먼저 그 근거가 맞는지 확인해서, 맞으면 지적하지 않고, 틀리거나 부족하면 확인을 요청하는 질문으로 남겨 주세요.
    - path: "**/src/main/java/**/*.java"
      instructions: >
        컨트롤러에는 비즈니스 로직이 없어야 하고 Application·도메인 서비스에서 처리해야 합니다. N+1 문제가 없는지 확인해 주세요.
        응답 변환은 Application(@Transactional 안)에서 엔티티를 XxxResult로 바꾸고, 컨트롤러에서 XxxResult를 응답 DTO로 바꿉니다.
        객체 생성은 엔티티 create, DTO 변환은 of/from을 씁니다.
        도메인 서비스·저장소 포트의 이름 방식(I 접두사, Impl, Port 접미사)은 지적하지 마세요. 저장소 어댑터에 @Transactional을 붙이라고 제안하지 마세요.
        알림은 resource_type + resource_id로 관리합니다. 댓글·관심사와 FK·연결 테이블로 이으라고 제안하지 마세요.
        조회 기록(ArticleViewStatus, RDBMS)과 활동 내역(MongoDB)의 중복은 의도된 구조입니다.
        좋아요 수·댓글 수 같은 카운트는 엔티티 값을 읽어 바꾸지 말고 DB에서 원자적으로 증감해야 합니다(UPDATE ... SET count = count + 1).
        논리 삭제 대상(사용자·뉴스기사·댓글) 조회에 deleted_at IS NULL 조건이 빠지지 않았는지,
        저장·수정·삭제하는 서비스 메서드에 @Transactional이 있는지,
        커서 페이지네이션이 limit + 1개를 조회해 다음 페이지 여부를 판단하는지,
        Swagger 길이 제약이 DTO 검증(@Size 등)과 엔티티 컬럼 길이에 맞는지 확인해 주세요.
        요청자 헤더 이름은 문자열 대신 MonewHeaders 상수를 써야 합니다.
        엔티티 컬럼 길이·제약(@Column length, nullable 등)을 바꾸면 운영 DB에 반영할 방법이 PR에 있는지 확인해 주세요.
        지금은 ddl-auto: update라 기존 컬럼이 바뀌지 않아 운영 DB에 직접 ALTER가 필요하고,
        Flyway 도입 후에는 새 V 파일이 필요합니다(validate는 길이를 검사하지 않음).
    - path: "**/src/test/**/*.java"
      instructions: >
        테스트 코드가 실제 동작을 검증하는지, 예외 케이스도 다루고 있는지 확인해 주세요.
        Testcontainers 이미지는 Postgres 16, Mongo 7이어야 합니다.
    - path: "**/*.{yaml,yml,properties}"
      instructions: >
        새 환경 변수를 추가했다면 .env.example, 운영 SSM 파라미터, ECS 태스크 정의까지 같이 반영됐는지 확인해 주세요.
        이미지 버전은 Postgres 16(RDS·compose·CI), Mongo 7(compose·CI·Testcontainers)로 맞춰야 합니다.
    - path: ".github/workflows/**"
      instructions: >
        ECR 태그는 불변이라 latest 같은 고정 태그로 push하면 안 됩니다.
        이미지 버전은 Postgres 16, Mongo 7로 맞춰야 합니다.

  request_changes_workflow: false

chat:
  auto_reply: true
