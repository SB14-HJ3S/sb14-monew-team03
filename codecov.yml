# 80%는 표시 목표이며 병합을 막는 새 기준으로 강제하지 않는다.
coverage:
  precision: 2
  round: down
  status:
    project:
      default:
        target: 80%
        informational: true
    patch:
      default:
        target: 80%
        informational: true
comment:
  # PR 댓글은 커버리지가 몇 %인지 한 줄만 보여 준다
  layout: "condensed_header"
  behavior: default
  # 커버리지가 바뀐 PR에만 댓글을 단다 — 워크플로·문서·설정만 바꾼 PR에는 달지 않음 (#113)
  require_changes: true
