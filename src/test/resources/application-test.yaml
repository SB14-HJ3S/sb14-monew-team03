# ==========================================================
# 테스트 환경 (test 프로파일) — 메인 application.yaml을 그대로 읽고, 테스트에서 달라야 하는 값만 여기서 덮어쓴다
# - 프로파일은 build.gradle의 test·externalTest 작업과 @IntegrationTest·@MongoIntegrationTest가 켠다
# - DB 접속 정보는 TestcontainersConfig·MongoTestcontainersConfig의 @ServiceConnection이 자동으로 넣어서 여기엔 안 적음
# - .env는 읽지 않는다
#   외부 키가 필요한 테스트는 ./gradlew externalTest로 돌리면 build.gradle이 .env 값을 환경변수로 넣어 줌
# ==========================================================
spring:
  jpa:
    hibernate:
      ddl-auto: create-drop # 테스트마다 빈 테이블에서 시작

  data:
    mongodb:
      # 앱 시작 때 Mongo 인덱스를 만들지 않는다
      # @IntegrationTest는 Mongo 컨테이너를 띄우지 않아서, 인덱스를 만들려고 접속하다 앱 시작이 실패한다
      auto-index-creation: false

monew:
  # 테스트 도중 @Scheduled 작업(매시간 수집 등)이 실행되지 않게 스케줄러를 끔 (SchedulingConfig)
  scheduling:
    enabled: false
