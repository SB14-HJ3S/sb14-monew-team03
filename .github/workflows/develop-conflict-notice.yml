name: Develop Conflict Notice

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [develop]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  notice:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: develop-conflict-notice-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: develop
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: 충돌이면 안내 댓글과 라벨
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const sync = require('./.github/scripts/develop-sync.js');
            await sync.conflictNotice({ github, context, core });
