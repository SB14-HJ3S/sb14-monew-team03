name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@f27be6b65a4652f08a2ba3cff79114829b588967 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_B }}
          # Claude 앱 토큰(contents: write) 대신 위 permissions(contents: read) 토큰을 쓰게 해서 커밋·푸시를 토큰 단계에서 막음
          # 댓글은 pull-requests·issues: write라 그대로 달림
          github_token: ${{ secrets.GITHUB_TOKEN }}
          track_progress: true
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: |
            중요: 이 리뷰의 모든 출력(인라인 코멘트, 요약 코멘트, 확인 코멘트 전부 포함)은 처음부터 끝까지 한국어로만 작성해. 코드 식별자(클래스명, 변수명, 예외 이름 등)는 원문 그대로 두되, 그 외 설명 문장에는 영어 문장을 절대 섞지 마.

            /code-review:code-review high --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}

            검토 결과 findings가 하나도 없으면, 반드시 다음 명령으로 확인 코멘트를 남겨줘:
            gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body "✅ Claude Code Review 완료 - 발견된 이슈 없음"

            리뷰 결과 요약 코멘트는 반드시 아래 형식으로 써줘. 위쪽 체크리스트로 "어디를, 무엇부터 고칠지" 한눈에 보이고, 아래 상세에서 코드와 함께 이유를 읽을 수 있게 하는 게 목적이야.

            ### ✅ 이전 리뷰에서 해결됨
            - (새 커밋 뒤 다시 리뷰할 때만. 무엇이 고쳐졌는지 한 줄씩. 처음 리뷰면 이 섹션은 빼)

            **🔴 심각 N · 🟠 중간 N · 🟡 참고 N**

            - [ ] 🔴 `파일명.java:줄` 문제 한 줄 요약
            - [ ] 🟠 `파일명.java:줄` 문제 한 줄 요약
            - [ ] 🟡 `파일명.java:줄` 문제 한 줄 요약

            ---

            ### 🔴 심각 — 문제 한 줄 요약

            **파일**: `src/.../파일명.java` (81~132번째 줄, `메서드명()`)

            ```java
            // 문제가 되는 코드 몇 줄만
            ```

            - 지금 코드가 어떻게 동작하는지 (짧은 bullet 2~4개)
            - 그래서 **어떤 일이 생기는지는 굵게**

            **제안**: 어떻게 고치면 되는지 1~2줄

            ---

            ### 🟠 중간 — ... (같은 형식)
            ### 🟡 참고 — ... (같은 형식)

            ### 📝 PR 관리
            - PR 본문 누락, Checkstyle·커버리지 등 체크 결과 (체크박스 없이)

            ### 참고 (필수 수정 아님)
            - 검토했지만 문제 삼지 않은 것과 그 이유 (없으면 빼)

            형식 규칙:
            - 등급은 🔴 심각(머지 전 필수) / 🟠 중간(이번 PR에서 권장) / 🟡 참고(선택) 세 가지만 써. 상세 섹션은 심각한 것부터.
            - 맨 위 개수는 실제 항목 수와 맞추고, 체크리스트 순서와 상세 섹션 순서를 같게 해.
            - 같은 문제가 여러 파일에 있으면 한 항목으로 묶고 파일을 나열해.
            - 코드 블록은 문제를 보여 주는 데 필요한 몇 줄만. 위치·클래스·메서드 이름은 항상 `백틱`으로 감싸.
            - 쉬운 말로 써. 전문 용어를 쓰면 괄호로 짧게 풀어 줘.
            - 인라인 코멘트도 첫 줄을 "🔴 **문제 한 줄 요약**"처럼 등급 이모지 + 굵은 제목으로 시작해.
            - "제가 수정하겠습니다" 같은 수정 제안은 쓰지 마. 너는 이 저장소의 코드를 수정할 수 없어.

            다시 한번 강조: 위 모든 코멘트는 한국어로 작성해야 해. 영어로 쓰지 마.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*)"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
