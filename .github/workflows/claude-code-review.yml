name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: develop 반영 커밋만 올라왔는지 확인
        id: skip
        if: github.event.action == 'synchronize'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          INFO=$(gh api "repos/$REPO/commits/$AFTER" --jq '"\(.parents|length)|\(.parents[0].sha)|\(.parents[1].sha)|\(.commit.message|split("\n")[0])"' 2>/dev/null) || exit 0
          IFS='|' read -r NP P1 P2 TITLE <<< "$INFO"
          if [ "$NP" -ne 2 ] || [ "$P1" != "$BEFORE" ] || [[ "$TITLE" != "merge : "* ]]; then exit 0; fi
          git init -q "$RUNNER_TEMP/merge-check" && cd "$RUNNER_TEMP/merge-check"
          git fetch -q "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "$AFTER" || exit 0
          AUTO=$(git merge-tree --write-tree --name-only --no-messages "$P1" "$P2" 2>/dev/null) || AUTO=conflict
          if [ "$AUTO" = "$(git rev-parse "$AFTER^{tree}")" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::develop 반영(merge :) 커밋만 올라와서 자동 리뷰를 건너뜁니다."
          else
            echo "::notice::머지하면서 충돌을 풀거나 코드를 고쳐서 자동 리뷰를 실행합니다."
          fi

      - name: Checkout repository
        if: steps.skip.outputs.skip != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        if: steps.skip.outputs.skip != 'true'
        id: claude-review
        uses: anthropics/claude-code-action@f27be6b65a4652f08a2ba3cff79114829b588967 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_B }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: |
            중요: 이 리뷰의 모든 출력(인라인 코멘트, 요약 코멘트, 확인 코멘트 전부 포함)은 처음부터 끝까지 한국어로만 작성해. 코드 식별자(클래스명, 변수명, 예외 이름 등)는 원문 그대로 두되, 그 외 설명 문장에는 영어 문장을 절대 섞지 마.

            /code-review:code-review high --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}

            리뷰 결과는 아래 형식의 요약 코멘트 하나에만 써. 요약 코멘트와 별개로 "리뷰 완료" 같은 확인 코멘트를 하나 더 달지는 마.
            이 PR의 첫 리뷰(이전 `<!-- claude-review -->` 댓글이 없음)는 지적이 하나도 없어도 요약 코멘트 1개를 반드시 남기고, 맨 아래에 "## ✅ 머지해도 됩니다"와 그 아랫줄 "Claude Code Review 완료 - 발견된 이슈 없음"을 써.
            요약 코멘트는 반드시 아래처럼 작은따옴표 heredoc으로 남겨. `--body "<본문>"`처럼 본문을 따옴표 안에 넣으면 줄바꿈 뒤 `#` 때문에 실행이 막혀.
            ```
            gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body-file - <<'REVIEW_EOF'
            <!-- claude-review -->
            (리뷰 본문)
            REVIEW_EOF
            ```
            본문 맨 첫 줄은 `<!-- claude-review -->`야. 이전 리뷰는 `gh pr view ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --comments`에서 이 표시가 있는 댓글로 찾아.

            다시 리뷰할 때 같은 말을 반복하지 마:
            - 직전 리뷰와 비교해서 새로 찾은 지적(🔴·🟠·🟡)이 없고, 고쳐진 항목도 없으면 요약 코멘트를 아예 남기지 마. 인라인 코멘트도 달지 마. 새 참고 거리만 있는 것도 댓글을 남길 이유가 아니야.
            - 새 지적은 없고 고쳐진 항목만 있으면, 첫 줄 리뷰 표시 다음에 "### ✅ 이전 리뷰에서 해결됨"과 머지 판단 한 줄만 써. 체크리스트·참고·요약은 빼.
            - 새 지적이 있으면 아래 형식대로 쓰되, 이전 지적은 체크리스트에 한 줄로만 남겨.
            - "참고 (필수 수정 아님)"에는 이번에 새로 바뀐 코드에 대한 것만 써. 이전 리뷰(너나 CodeRabbit)에서 이미 쓴 참고와 같거나 비슷한 내용은 다시 쓰지 말고, 새로 쓸 게 없으면 섹션을 통째로 빼.
            - 이미 인라인 코멘트를 단 문제에는 인라인 코멘트를 다시 달지 마.

            리뷰 결과 요약 코멘트는 반드시 아래 형식으로 써줘. 위쪽 체크리스트로 "어디를, 무엇부터 고칠지" 한눈에 보이고, 아래 상세에서 코드와 함께 이유를 읽을 수 있게 하는 게 목적이야.

            > 🔁 **3번째 리뷰** · PR의 4~5번째 커밋(`14262ee` `a1b2c3d`) 검토 — 2번째 리뷰 이후 새로 올라온 커밋입니다.   (처음이면: > 🆕 **1번째 리뷰** · PR의 1~3번째 커밋(`9149151` ~ `b889c45`) 검토)

            ### ✅ 이전 리뷰에서 해결됨
            - [x] `파일명.java:줄` 무엇이 고쳐졌는지 한 줄
            - (새 커밋 뒤 다시 리뷰할 때만. 이전 리뷰에서 지적한 것 중 고쳐진 걸 체크 완료([x])로 한 줄씩. 처음 리뷰면 이 섹션은 빼)

            **🔴 필수 N** 머지 전 반드시 수정 (오류·버그, 요구사항과 안 맞는 경우) · **🟠 권장 N** 지금 고치길 권장 (나중에 고치면 비용이 큼) · **🟡 선택 N** 선택 사항

            - [ ] **1.** 🔴 `파일명.java:줄` 문제 한 줄 요약 **(신규)**
            - [ ] **2.** 🟡 `파일명.java:줄` 문제 한 줄 요약 **(신규 · 인라인 코멘트 남김)**
            - [ ] **3.** 🟠 `파일명.java:줄` 문제 한 줄 요약 **(이전 지적 · 아직 유효)**

            ---

            ### 1. 🔴 필수 — 문제 한 줄 요약 (신규)

            **파일**: `src/.../파일명.java` (81~132번째 줄, `메서드명()`)

            ```java
            // 문제가 되는 코드 몇 줄만
            ```

            **지금 코드가 어떻게 동작하는지 한 문장 (굵게).**
            그 근거를 1~3문장으로. 어느 메서드 몇 번째 줄인지 함께.

            **그래서 어떤 일이 생기는지 한 문장 (굵게).**
            구체적인 예(입력·상황)를 들어 1~3문장으로.

            **제안**: 어떻게 고치면 되는지 1~2줄

            ---

            ### 2. 🟠 권장 — ... (같은 형식)
            ### 3. 🟡 선택 — ... (같은 형식)

            ### 💬 PR 질문에 대한 답
            - PR 본문(리뷰 포인트 등)에 작성자가 물어본 게 있으면 여기서 답해. 없으면 이 섹션은 빼.

            ### 참고 (필수 수정 아님)

            **참고 1. 핵심 한 문장을 굵게.**
            왜 지금은 문제 삼지 않았는지 1~2문장. 나중에 다시 봐야 하면 언제 볼지도 함께.

            **참고 2. ...** (같은 형식, 없으면 이 섹션은 빼)

            ---

            ## 요약
            - 🔴 **수정 필요**: 문제 한 줄 — 위 1번
            - 🟠 **수정 권장**: 문제 한 줄 — 위 3번
            - 🟡 **선택**: 문제 한 줄 — 위 4번
            - ✅ **문제 없음**: 이번 PR에서 잘 된 부분이나 문제없어 보이는 변경을 한 줄로

            ---

            ## ⛔ 머지 불가능합니다 · 위 필수 2건 반영 필요

            형식 규칙:
            - 등급은 아래 세 가지만 써. 상세 섹션은 🔴 필수부터.
              - 🔴 필수: 머지 전에 반드시 수정해야 하는 것. 오류·버그, 요구사항(Swagger·노션 요구사항)과 안 맞는 경우
              - 🟠 권장: 지금은 동작하지만 나중에 고치면 비용이 큰 것 (다른 코드가 이 구조에 기대기 시작하기 전에 고쳐야 하는 것)
              - 🟡 선택: 컨벤션·가독성 등 고치면 좋은 것
            - 체크리스트 항목마다 새로 찾은 건 **(신규)**, 이전 리뷰(너나 CodeRabbit)에서 지적했는데 아직 안 고쳐진 건 🔴·🟠·🟡 모두 **(이전 지적 · 아직 유효)**를 붙여. 인라인 코멘트를 남긴 항목엔 "인라인 코멘트 남김"도 붙여.
            - **(이전 지적 · 아직 유효)** 항목은 고쳐질 때까지 체크리스트에 한 줄로만 남기고, 상세 섹션은 만들지 마. 설명은 처음 지적한 리뷰에 이미 있어. 상세 섹션은 **(신규)** 항목만 써서, 상세 번호는 건너뛸 수 있어.
            - CLAUDE.md의 "코드 리뷰 규칙"(지적 방식·도메인 규칙·우리 저장소에서만 깨지는 지점)을 따라. 리뷰 대상은 이 PR에서 변경된 부분으로 한정하고, 근거를 코드에서 찾지 못한 내용은 확인을 요청하는 질문으로 남겨.
            - 지금 당장 안 고쳐도 되지만 나중에 다시 봐야 하는 건, 언제 다시 봐야 하는지(예: `@Version` 도입 시점)도 같이 써.
            - 맨 첫 줄은 "몇 번째 리뷰인지 + PR의 몇 번째 커밋부터 몇 번째 커밋까지 봤는지 + 그 커밋들의 짧은 해시" 한 줄이야.
              - 몇 번째 리뷰인지는 이 PR에 달린 이전 Claude 리뷰 댓글(`<!-- claude-review -->` 표시가 있거나 "Claude finished"로 시작하는 댓글) 수 + 1.
              - 커밋 순서는 `gh pr view ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --json commits`의 순서(첫 커밋 = 1번째)로 세.
              - 다시 리뷰면 직전 리뷰 이후 새로 올라온 커밋만, 처음이면 PR 전체 커밋 범위를 써. 커밋이 4개 이상이면 첫·마지막 해시만 "~"로 이어.
              - 제목이나 다른 설명은 붙이지 마.
            - 등급 이름은 이모지 + 필수·권장·선택으로만 써. P1·P2·P3나 심각·중간·낮음(high/medium/low) 같은 다른 표기는 쓰지 마.
            - 개수 줄은 위 모양 그대로 한 줄로 써. 등급 설명 문구도 매번 그대로 넣고, 개수가 0이어도 빼지 마. 결론 문장이나 등급 설명을 따로 한 줄 더 쓰지 마 (중복).
            - 맨 위 개수는 체크리스트 전체 항목 수(신규 + 이전 지적)와 맞추고, 체크리스트 순서와 상세 섹션 순서를 같게 해.
            - 머지 판단은 요약 아래 구분선(---) 다음에 "## 요약"과 같은 크기의 "## " 제목 한 줄로 써. "머지 판단" 같은 머리 제목은 따로 달지 마. 건수에는 **(이전 지적 · 아직 유효)** 항목도 포함해.
              - 🔴 필수가 1건 이상: "## ⛔ 머지 불가능합니다 · 위 필수 N건 반영 필요"
              - 🔴 필수 0건, 🟠 권장 1건 이상: "## ⚠️ 머지해도 되지만, 권장 N건은 지금 고치는 게 좋습니다"
              - 🔴·🟠 0건: "## ✅ 머지해도 됩니다"
              - 🔴·🟠·🟡가 모두 0건이면 그 아래 줄에 "Claude Code Review 완료 - 발견된 이슈 없음"을 덧붙여.
            - 참고 섹션은 "**참고 N. 핵심 한 문장**" + 그 아래 1~2문장으로 쓰고, 항목 사이에 빈 줄을 넣어. 번호는 위 지적 번호와 따로 1부터 매겨.
            - 맨 아래 요약은 항목마다 한 줄씩, 위 상세의 번호를 "— 위 N번"으로 가리켜. 같은 등급 항목이 여러 개면 "— 위 1·2번"처럼 묶어도 돼. 마지막 줄엔 문제없어 보이는 변경을 꼭 써.
            - 체크리스트와 상세 섹션 제목에 같은 번호(1, 2, 3 …)를 매겨. 번호는 등급이 바뀌어도 끊지 말고 끝까지 이어서 매겨.
            - 같은 문제가 여러 파일에 있으면 한 항목으로 묶고 파일을 나열해.
            - 코드 블록은 문제를 보여 주는 데 필요한 몇 줄만. 위치·클래스·메서드 이름은 항상 `백틱`으로 감싸.
            - 쉬운 말로 써. 전문 용어를 쓰면 괄호로 짧게 풀어 줘.
            - 가독성 규칙 (중요):
              - 상세 설명은 "**핵심 한 문장(굵게)** + 그 아래 1~3문장 설명" 덩어리로 나누고, 덩어리 사이에는 반드시 빈 줄을 넣어.
              - 한 단락은 3문장을 넘기지 마. 길어지면 단락을 나눠.
              - 제목·코드 블록·체크리스트 앞뒤에도 빈 줄을 넣어. 글이 한 덩어리로 붙지 않게 해.
              - 정책 판단이 필요한 항목은 "팀에서 정할 일"이라고 밝히고, 유지할 경우 남겨 둘 메모와 고칠 경우의 방법을 둘 다 짧게 써.
            - 인라인 코멘트도 첫 줄을 "🔴 **문제 한 줄 요약**"처럼 등급 이모지 + 굵은 제목으로 시작해.
            - 어떻게 고치면 되는지(**제안**)는 구체적으로 써 줘. 다만 "제가 수정하겠습니다", "말씀해 주시면 고쳐 드릴게요"처럼 직접 고쳐 주겠다는 말은 하지 마. 너는 이 저장소의 코드를 수정할 수 없고, 고치는 건 PR 작성자가 해.

            다시 한번 강조: 위 모든 코멘트는 한국어로 작성해야 해. 영어로 쓰지 마.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr view:*)"'
