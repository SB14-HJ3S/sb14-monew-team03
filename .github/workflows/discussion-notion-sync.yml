name: Discussion → Notion Meeting Notes Sync

on:
  discussion:
    types: [ created, labeled ]

permissions:
  contents: read
  discussions: write

env:
  NOTION_DB_ID: "4a89e310-9743-831e-a003-01a1c5314951"
  # ⚠️ b-daily-scrum.yml의 기본 title과 같아야 함 (이 문구 그대로면 자동 제목으로 바꿈)
  PLACEHOLDER_TITLE: "제목을 수정하지 않으면 자동 제목으로 채워집니다"

jobs:
  create:
    if: github.event.action == 'created' && github.event.discussion.category.name == 'B. Daily Scrum'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: 노션 변환 라이브러리 설치
        continue-on-error: true
        run: npm ci --prefix .github/scripts --ignore-scripts --no-audit --no-fund

      - name: 봇 토큰 만들기
        id: bot
        if: vars.DISCUSSION_BOT_CLIENT_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.DISCUSSION_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DISCUSSION_BOT_PRIVATE_KEY }}

      - name: 디스커션 본문에서 노션 카테고리·참여자·날짜·특이사항 추출
        id: fields
        env:
          BODY: ${{ github.event.discussion.body }}
        run: |
          # note는 extract-meeting-fields.sh가 항상 한 줄로 합쳐 주므로 그대로 출력해도 됨
          RESULT=$(printf '%s' "$BODY" | bash .github/scripts/extract-meeting-fields.sh)
          {
            echo "note=$(echo "$RESULT" | jq -r '.note')"
            echo "date_override=$(echo "$RESULT" | jq -r '.date_override')"
            echo "participants=$(echo "$RESULT" | jq -c '.participants')"
            echo "meeting_type=$(echo "$RESULT" | jq -r '.meeting_type')"
            echo "category=$(echo "$RESULT" | jq -r '.category')"
          } >> "$GITHUB_OUTPUT"

      - name: 자동 제목 정하기
        id: title
        env:
          CURRENT_TITLE: ${{ github.event.discussion.title }}
          CREATED_AT: ${{ github.event.discussion.created_at }}
          DATE_OVERRIDE: ${{ steps.fields.outputs.date_override }}
          MEETING_TYPE: ${{ steps.fields.outputs.meeting_type }}
        run: |
          RESULT=$(bash .github/scripts/build-meeting-title.sh)
          AUTO_TITLE=$(echo "$RESULT" | jq -r '.title')
          AUTO_PATTERN='^\[[0-9]{2}[.-]?[0-9]{2}[.-]?[0-9]{2}\([^)]+\)\]( (데일리 스크럼|정기 회의|비정기 회의))?$'
          CURRENT=$(printf '%s' "$CURRENT_TITLE" | sed -E 's/^[[:space:]]+|[[:space:]]+$//g')
          if [[ "$CURRENT" == "$PLACEHOLDER_TITLE" || "$CURRENT" =~ $AUTO_PATTERN ]]; then
            TITLE="$AUTO_TITLE"
          else
            TITLE="$CURRENT"
          fi
          {
            echo "title=$TITLE"
            echo "rename=$([[ "$TITLE" != "$CURRENT_TITLE" ]] && echo true || echo false)"
            echo "date=$(echo "$RESULT" | jq -r '.date')"
            echo "date_label=$(echo "$RESULT" | jq -r '.date_label')"
          } >> "$GITHUB_OUTPUT"

      - name: 디스커션 제목을 자동 제목으로 바꾸기
        if: steps.title.outputs.rename == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token || secrets.GITHUB_TOKEN }}
          DISCUSSION_NODE_ID: ${{ github.event.discussion.node_id }}
          TITLE: ${{ steps.title.outputs.title }}
        run: |
          gh api graphql -f query='
            mutation($discussionId: ID!, $title: String!) {
              updateDiscussion(input: {discussionId: $discussionId, title: $title}) {
                discussion { id }
              }
            }' \
            -f discussionId="$DISCUSSION_NODE_ID" \
            -f title="$TITLE"

      - name: 비워 둔 날짜 칸 채우고 칸 사이 구분선 넣기
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token || secrets.GITHUB_TOKEN }}
          DISCUSSION_NODE_ID: ${{ github.event.discussion.node_id }}
          BODY: ${{ github.event.discussion.body }}
          DATE_LABEL: ${{ steps.title.outputs.date_label }}
          CREATED_AT: ${{ github.event.discussion.created_at }}
        run: |
          # 멘토링처럼 작성 시각(한국 시간)도 같이 적는다
          FILL_LABEL="$DATE_LABEL $(TZ=Asia/Seoul date -d "$CREATED_AT" +%H:%M)"
          FILLED=$(printf '%s' "$BODY" | DATE_LABEL="$FILL_LABEL" bash .github/scripts/fill-date-field.sh)
          # 멤버별·기타 칸(📝·📑) 위에 구분선도 넣는다. 이미 있으면 그대로 둔다
          NEW_BODY=$(printf '%s' "${FILLED:-$BODY}" | bash .github/scripts/add-dividers.sh)
          if [[ "$NEW_BODY" == "$(printf '%s' "$BODY" | tr -d '\r')" ]]; then
            echo "날짜 칸이 채워져 있고 구분선도 있어 건너뜁니다."
            exit 0
          fi
          gh api graphql -f query='
            mutation($discussionId: ID!, $body: String!) {
              updateDiscussion(input: {discussionId: $discussionId, body: $body}) { discussion { id } }
            }' -f discussionId="$DISCUSSION_NODE_ID" -f body="$NEW_BODY"

      - name: 디스커션에 회의 종류 라벨 붙이기
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token || secrets.GITHUB_TOKEN }}
          DISCUSSION_NODE_ID: ${{ github.event.discussion.node_id }}
          MEETING_TYPE: ${{ steps.fields.outputs.meeting_type }}
        run: |
          case "$MEETING_TYPE" in
            "정기 회의") LABEL_NAME="regular:정기회의" ;;
            "비정기 회의") LABEL_NAME="adhoc:비정기회의" ;;
            *) LABEL_NAME="scrum:데일리스크럼" ;;
          esac
          LABEL_ID=$(gh api graphql -f query='
            query($owner: String!, $repo: String!, $name: String!) {
              repository(owner: $owner, name: $repo) { label(name: $name) { id } }
            }' -f owner="${GITHUB_REPOSITORY%/*}" -f repo="${GITHUB_REPOSITORY#*/}" -f name="$LABEL_NAME" \
            --jq '.data.repository.label.id // empty')
          if [[ -z "$LABEL_ID" ]]; then
            echo "::warning::$LABEL_NAME 라벨이 저장소에 없어서 건너뜁니다."
            exit 0
          fi
          gh api graphql -f query='
            mutation($labelableId: ID!, $labelIds: [ID!]!) {
              addLabelsToLabelable(input: {labelableId: $labelableId, labelIds: $labelIds}) { clientMutationId }
            }' -f labelableId="$DISCUSSION_NODE_ID" -f labelIds[]="$LABEL_ID"

          # 템플릿이 기본으로 scrum:데일리스크럼을 붙이므로, 다른 회의 종류를 골랐으면 그 라벨은 뗀다
          if [[ "$LABEL_NAME" != "scrum:데일리스크럼" ]]; then
            SCRUM_ID=$(gh api graphql -f query='
              query($owner: String!, $repo: String!) {
                repository(owner: $owner, name: $repo) { label(name: "scrum:데일리스크럼") { id } }
              }' -f owner="${GITHUB_REPOSITORY%/*}" -f repo="${GITHUB_REPOSITORY#*/}" --jq '.data.repository.label.id // empty')
            if [[ -n "$SCRUM_ID" ]]; then
              gh api graphql -f query='
                mutation($labelableId: ID!, $labelIds: [ID!]!) {
                  removeLabelsFromLabelable(input: {labelableId: $labelableId, labelIds: $labelIds}) { clientMutationId }
                }' -f labelableId="$DISCUSSION_NODE_ID" -f labelIds[]="$SCRUM_ID"
            fi
          fi

      - name: 노션에 회의록 카드 생성
        id: create_page
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          TITLE: ${{ steps.title.outputs.title }}
          DATE_ONLY: ${{ steps.title.outputs.date }}
          BODY: ${{ github.event.discussion.body }}
          DISCUSSION_URL: ${{ github.event.discussion.html_url }}
          AUTHOR: ${{ github.event.discussion.user.login }}
          NOTE: ${{ steps.fields.outputs.note }}
          CATEGORY: ${{ steps.fields.outputs.category }}
          PARTICIPANTS: ${{ steps.fields.outputs.participants }}
          NOTION_USER_MAP: ${{ vars.NOTION_USER_MAP }}
          NOTION_PARTICIPANT_MAP: ${{ vars.NOTION_PARTICIPANT_MAP }}
          MEETING_TYPE: ${{ steps.fields.outputs.meeting_type }}
          DATE_LABEL: ${{ steps.title.outputs.date_label }}
        run: |
          # 본문을 노션 블록으로 바꿔 넣음 (비운 항목·속성으로 들어간 항목은 뺌)
          # 노션 본문 맨 위에 연동 기록 한 줄(GitHub 연동 댓글과 같은 시각)
          SYNCED_AT=$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')
          BLOCKS=$(printf '%s' "$BODY" | EXTRA_NOTE="$(FIRST="$SYNCED_AT" MODE=line bash .github/scripts/build-sync-comment.sh)" bash .github/scripts/build-notion-blocks.sh)

          PAYLOAD=$(jq -n \
            --arg db_id "$NOTION_DB_ID" \
            --argjson blocks "$BLOCKS" \
            --argjson usermap "${NOTION_USER_MAP:-{\}}" \
            --argjson pmap "${NOTION_PARTICIPANT_MAP:-{\}}" \
            --arg title "$TITLE" \
            --arg date "$DATE_ONLY" \
            --arg author "$AUTHOR" \
            --arg note "$NOTE" \
            --arg category "$CATEGORY" \
            --arg meeting_type "$MEETING_TYPE" \
            --argjson participants "${PARTICIPANTS:-[]}" \
            '{
              parent: {database_id: $db_id},
              properties: ({
                "회의록": {title: [{text: {content: $title}}]},
                "날짜": {date: {start: $date}},
                "특징": {select: {name: (if $meeting_type == "정기 회의" or $meeting_type == "비정기 회의" then $meeting_type else "스크럼" end)}},
                "카테고리": {multi_select: [{name: $category}]},
                "특이사항": {rich_text: (if $note == "" then [] else [{text: {content: $note}}] end)}
              }
              + (if ($participants | length) == 0 then {} else {"참여자 명단": {multi_select: ($participants | map({name: .}))}} end)
              + (if $usermap[$author] then {"서기": {people: [{id: $usermap[$author]}]}} else {} end)
              + ([$participants[] | $pmap[.] | select(. != null) | {id: .}] as $people
                 | if ($people | length) == 0 then {} else {"참여자": {people: $people}} end)
              ),
              children: $blocks[:100]
            }')

          RESPONSE=$(curl -sS --fail --max-time 15 \
            -X POST "https://api.notion.com/v1/pages" \
            -H "Authorization: Bearer $NOTION_TOKEN" \
            -H "Notion-Version: 2022-06-28" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          PAGE_URL=$(echo "$RESPONSE" | jq -r '.url // empty')
          if [[ -z "$PAGE_URL" ]]; then
            echo "::error::노션 페이지 생성 실패: $RESPONSE"
            exit 1
          fi
          # 노션은 한 번에 블록 100개까지만 받아서, 나머지는 만든 페이지 뒤에 이어 붙인다
          # 실패해도 페이지는 이미 생겼으니 연동 댓글은 남기고, 재연동으로 다시 채울 수 있게 경고만
          jq -c '.[100:]' <<<"$BLOCKS" \
            | bash .github/scripts/append-notion-blocks.sh "$(echo "$RESPONSE" | jq -r '.id')" \
            || echo "::warning::본문 일부를 노션에 못 넣었습니다. resync:재연동 라벨로 다시 채워 주세요."
          echo "page_url=$PAGE_URL" >> "$GITHUB_OUTPUT"
          echo "synced_at=$SYNCED_AT" >> "$GITHUB_OUTPUT"

      - name: 노션 링크 디스커션 댓글로 남기기
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token || secrets.GITHUB_TOKEN }}
          DISCUSSION_NODE_ID: ${{ github.event.discussion.node_id }}
          PAGE_URL: ${{ steps.create_page.outputs.page_url }}
          FIRST: ${{ steps.create_page.outputs.synced_at }}
        run: |
          COMMENT_BODY=$(PAGE_URL="$PAGE_URL" TARGET=디스커션 FIRST="$FIRST" bash .github/scripts/build-sync-comment.sh)

          gh api graphql -f query='
            mutation($discussionId: ID!, $body: String!) {
              addDiscussionComment(input: {discussionId: $discussionId, body: $body}) {
                comment { id }
              }
            }' \
            -f discussionId="$DISCUSSION_NODE_ID" \
            -f body="$COMMENT_BODY"

  resync:
    if: github.event.action == 'labeled' && github.event.label.name == 'resync:재연동' && github.event.discussion.category.name == 'B. Daily Scrum'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: 노션 변환 라이브러리 설치
        continue-on-error: true
        run: npm ci --prefix .github/scripts --ignore-scripts --no-audit --no-fund

      - name: 봇 토큰 만들기
        id: bot
        if: vars.DISCUSSION_BOT_CLIENT_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.DISCUSSION_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DISCUSSION_BOT_PRIVATE_KEY }}

      - name: 기존 노션 페이지 ID 찾기
        id: find_page
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          DISCUSSION_NUMBER: ${{ github.event.discussion.number }}
        run: |
          PAGE_URL=""
          COMMENT_ID=""
          COMMENT_AUTHOR=""
          CURSOR=""

          while :; do
            if [[ -n "$CURSOR" ]]; then
              RESULT=$(gh api graphql -f query='
                query($owner: String!, $repo: String!, $number: Int!, $after: String) {
                  repository(owner: $owner, name: $repo) {
                    discussion(number: $number) {
                      comments(first: 50, after: $after) {
                        pageInfo { hasNextPage endCursor }
                        nodes { id body author { login } }
                      }
                    }
                  }
                }' -f owner="$OWNER" -f repo="$REPO" -F number="$DISCUSSION_NUMBER" -f after="$CURSOR")
            else
              RESULT=$(gh api graphql -f query='
                query($owner: String!, $repo: String!, $number: Int!) {
                  repository(owner: $owner, name: $repo) {
                    discussion(number: $number) {
                      comments(first: 50) {
                        pageInfo { hasNextPage endCursor }
                        nodes { id body author { login } }
                      }
                    }
                  }
                }' -f owner="$OWNER" -f repo="$REPO" -F number="$DISCUSSION_NUMBER")
            fi

            # 가장 최근 연동 댓글(봇 또는 github-actions)에서 노션 주소·댓글 id를 꺼냄 — 재연동 때 이 댓글을 고침
            SYNC_COMMENT=$(echo "$RESULT" | jq -c '
              [.data.repository.discussion.comments.nodes[]
               | select(.author.login == "github-actions" or .author.login == "monew-team03")
               | select(.body | contains("노션 동기화됨"))] | last // empty')
            if [[ -n "$SYNC_COMMENT" ]]; then
              PAGE_URL=$(echo "$SYNC_COMMENT" | jq -r .body | grep -oE 'https://[^ ]*notion[^ ]*' | head -1)
              COMMENT_ID=$(echo "$SYNC_COMMENT" | jq -r .id)
              COMMENT_AUTHOR=$(echo "$SYNC_COMMENT" | jq -r .author.login)
            fi

            HAS_NEXT=$(echo "$RESULT" | jq -r '.data.repository.discussion.comments.pageInfo.hasNextPage')
            if [[ "$HAS_NEXT" != "true" ]]; then
              break
            fi
            CURSOR=$(echo "$RESULT" | jq -r '.data.repository.discussion.comments.pageInfo.endCursor')
          done

          if [[ -z "$PAGE_URL" ]]; then
            echo "::error::이전에 동기화된 노션 페이지를 댓글에서 찾을 수 없습니다. (최초 생성이 실패했을 수 있음)"
            exit 1
          fi

          PAGE_ID=$(echo "$PAGE_URL" | grep -oE '[0-9a-f]{32}' | tail -1)
          if [[ -z "$PAGE_ID" ]]; then
            echo "::error::댓글에서 노션 페이지 ID를 추출하지 못했습니다: $PAGE_URL"
            exit 1
          fi
          echo "page_id=$PAGE_ID" >> "$GITHUB_OUTPUT"
          echo "page_url=$PAGE_URL" >> "$GITHUB_OUTPUT"
          echo "comment_id=$COMMENT_ID" >> "$GITHUB_OUTPUT"
          echo "comment_author=$COMMENT_AUTHOR" >> "$GITHUB_OUTPUT"

      - name: 연동 기록 계산
        id: sync_meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_ID: ${{ steps.find_page.outputs.comment_id }}
        run: |
          OLD=$(gh api graphql -f query='
            query($id: ID!) { node(id: $id) { ... on DiscussionComment { body createdAt } } }' -f id="$COMMENT_ID" || echo '{}')
          OLD_BODY="$(echo "$OLD" | jq -r '.data.node.body // empty')" \
          OLD_CREATED_AT="$(echo "$OLD" | jq -r '.data.node.createdAt // empty')" \
          MODE=meta bash .github/scripts/build-sync-comment.sh >> "$GITHUB_OUTPUT"

      - name: 디스커션 본문에서 노션 카테고리·참여자·날짜·특이사항 추출
        id: fields
        env:
          BODY: ${{ github.event.discussion.body }}
        run: |
          RESULT=$(printf '%s' "$BODY" | bash .github/scripts/extract-meeting-fields.sh)
          {
            echo "note=$(echo "$RESULT" | jq -r '.note')"
            echo "date_override=$(echo "$RESULT" | jq -r '.date_override')"
            echo "participants=$(echo "$RESULT" | jq -c '.participants')"
            echo "meeting_type=$(echo "$RESULT" | jq -r '.meeting_type')"
            echo "category=$(echo "$RESULT" | jq -r '.category')"
          } >> "$GITHUB_OUTPUT"

      - name: 자동 제목 정하기
        id: title
        env:
          CURRENT_TITLE: ${{ github.event.discussion.title }}
          CREATED_AT: ${{ github.event.discussion.created_at }}
          DATE_OVERRIDE: ${{ steps.fields.outputs.date_override }}
          MEETING_TYPE: ${{ steps.fields.outputs.meeting_type }}
        run: |
          RESULT=$(bash .github/scripts/build-meeting-title.sh)
          AUTO_TITLE=$(echo "$RESULT" | jq -r '.title')
          AUTO_PATTERN='^\[[0-9]{2}[.-]?[0-9]{2}[.-]?[0-9]{2}\([^)]+\)\]( (데일리 스크럼|정기 회의|비정기 회의))?$'
          CURRENT=$(printf '%s' "$CURRENT_TITLE" | sed -E 's/^[[:space:]]+|[[:space:]]+$//g')
          if [[ "$CURRENT" == "$PLACEHOLDER_TITLE" || "$CURRENT" =~ $AUTO_PATTERN ]]; then
            TITLE="$AUTO_TITLE"
          else
            TITLE="$CURRENT"
          fi
          {
            echo "title=$TITLE"
            echo "rename=$([[ "$TITLE" != "$CURRENT_TITLE" ]] && echo true || echo false)"
            echo "date=$(echo "$RESULT" | jq -r '.date')"
            echo "date_label=$(echo "$RESULT" | jq -r '.date_label')"
          } >> "$GITHUB_OUTPUT"

      - name: 디스커션 제목을 자동 제목으로 바꾸기
        if: steps.title.outputs.rename == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token || secrets.GITHUB_TOKEN }}
          DISCUSSION_NODE_ID: ${{ github.event.discussion.node_id }}
          TITLE: ${{ steps.title.outputs.title }}
        run: |
          gh api graphql -f query='
            mutation($discussionId: ID!, $title: String!) {
              updateDiscussion(input: {discussionId: $discussionId, title: $title}) {
                discussion { id }
              }
            }' \
            -f discussionId="$DISCUSSION_NODE_ID" \
            -f title="$TITLE"

      - name: 비워 둔 날짜 칸 채우고 칸 사이 구분선 넣기
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token || secrets.GITHUB_TOKEN }}
          DISCUSSION_NODE_ID: ${{ github.event.discussion.node_id }}
          BODY: ${{ github.event.discussion.body }}
          DATE_LABEL: ${{ steps.title.outputs.date_label }}
          CREATED_AT: ${{ github.event.discussion.created_at }}
        run: |
          # 멘토링처럼 작성 시각(한국 시간)도 같이 적는다
          FILL_LABEL="$DATE_LABEL $(TZ=Asia/Seoul date -d "$CREATED_AT" +%H:%M)"
          FILLED=$(printf '%s' "$BODY" | DATE_LABEL="$FILL_LABEL" bash .github/scripts/fill-date-field.sh)
          # 멤버별·기타 칸(📝·📑) 위에 구분선도 넣는다. 이미 있으면 그대로 둔다
          NEW_BODY=$(printf '%s' "${FILLED:-$BODY}" | bash .github/scripts/add-dividers.sh)
          if [[ "$NEW_BODY" == "$(printf '%s' "$BODY" | tr -d '\r')" ]]; then
            echo "날짜 칸이 채워져 있고 구분선도 있어 건너뜁니다."
            exit 0
          fi
          gh api graphql -f query='
            mutation($discussionId: ID!, $body: String!) {
              updateDiscussion(input: {discussionId: $discussionId, body: $body}) { discussion { id } }
            }' -f discussionId="$DISCUSSION_NODE_ID" -f body="$NEW_BODY"

      - name: 노션 페이지 확인
        id: page
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          PAGE_ID: ${{ steps.find_page.outputs.page_id }}
          PAGE_URL: ${{ steps.find_page.outputs.page_url }}
          TITLE_PROP: 회의록
          TITLE: ${{ steps.title.outputs.title }}
          CATEGORY: ${{ steps.fields.outputs.category }}
        run: bash .github/scripts/ensure-notion-page.sh >> "$GITHUB_OUTPUT"

      - name: 노션 페이지 속성 덮어쓰기
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          PAGE_ID: ${{ steps.page.outputs.page_id }}
          TITLE: ${{ steps.title.outputs.title }}
          NOTE: ${{ steps.fields.outputs.note }}
          CATEGORY: ${{ steps.fields.outputs.category }}
          DATE_OVERRIDE: ${{ steps.fields.outputs.date_override || (steps.page.outputs.created == 'true' && steps.title.outputs.date) || '' }}
          PARTICIPANTS: ${{ steps.fields.outputs.participants }}
          AUTHOR: ${{ github.event.discussion.user.login }}
          NOTION_USER_MAP: ${{ vars.NOTION_USER_MAP }}
          NOTION_PARTICIPANT_MAP: ${{ vars.NOTION_PARTICIPANT_MAP }}
          MEETING_TYPE: ${{ steps.fields.outputs.meeting_type }}
        run: |
          # 재연동은 지금 글 상태를 그대로 반영하므로, 참여자가 비었어도 보내서 노션에서도 지워지게 함
          PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --arg note "$NOTE" \
            --arg category "$CATEGORY" \
            --arg date "$DATE_OVERRIDE" \
            --arg author "$AUTHOR" \
            --arg meeting_type "$MEETING_TYPE" \
            --argjson usermap "${NOTION_USER_MAP:-{\}}" \
            --argjson pmap "${NOTION_PARTICIPANT_MAP:-{\}}" \
            --argjson participants "${PARTICIPANTS:-[]}" \
            '{
              properties: ({
                "회의록": {title: [{text: {content: $title}}]},
                "특이사항": {rich_text: (if $note == "" then [] else [{text: {content: $note}}] end)},
                "참여자 명단": {multi_select: ($participants | map({name: .}))}
              }
              + (if $date == "" then {} else {"날짜": {date: {start: $date}}} end)
              + (if $category == "" or $category == "[미정]" then {} else {"카테고리": {multi_select: [{name: $category}]}} end)
              + (if $meeting_type == "" then {} else {"특징": {select: {name: (if $meeting_type == "정기 회의" or $meeting_type == "비정기 회의" then $meeting_type else "스크럼" end)}}} end)
              + (if $usermap[$author] then {"서기": {people: [{id: $usermap[$author]}]}} else {} end)
              + (if ($pmap | length) == 0 then {} else {"참여자": {people: [$participants[] | $pmap[.] | select(. != null) | {id: .}]}} end)
              )
            }')

          curl -sS --fail --max-time 15 \
            -X PATCH "https://api.notion.com/v1/pages/$PAGE_ID" \
            -H "Authorization: Bearer $NOTION_TOKEN" \
            -H "Notion-Version: 2022-06-28" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"

      - name: 기존 본문 블록 ID 수집 (아직 삭제 안 함)
        id: old_blocks
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          PAGE_ID: ${{ steps.page.outputs.page_id }}
        run: |
          : > /tmp/old_block_ids.txt
          CURSOR=""

          while :; do
            URL="https://api.notion.com/v1/blocks/$PAGE_ID/children?page_size=100"
            if [[ -n "$CURSOR" ]]; then
              URL="${URL}&start_cursor=${CURSOR}"
            fi

            RESPONSE=$(curl -sS --fail --retry 3 --retry-delay 2 --max-time 15 \
              "$URL" \
              -H "Authorization: Bearer $NOTION_TOKEN" \
              -H "Notion-Version: 2022-06-28")

            echo "$RESPONSE" | jq -r '.results[].id' >> /tmp/old_block_ids.txt

            HAS_MORE=$(echo "$RESPONSE" | jq -r '.has_more')
            if [[ "$HAS_MORE" != "true" ]]; then
              break
            fi
            CURSOR=$(echo "$RESPONSE" | jq -r '.next_cursor')
          done

          echo "기존 블록 $(wc -l < /tmp/old_block_ids.txt)개 수집"

      - name: 노션 페이지에 현재 본문 먼저 쓰기
        env:
          SYNC_FIRST: ${{ steps.sync_meta.outputs.first }}
          SYNC_NOW: ${{ steps.sync_meta.outputs.now }}
          SYNC_COUNT: ${{ steps.sync_meta.outputs.count }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          PAGE_ID: ${{ steps.page.outputs.page_id }}
          BODY: ${{ github.event.discussion.body }}
          AUTHOR: ${{ github.event.discussion.user.login }}
          DISCUSSION_URL: ${{ github.event.discussion.html_url }}
          DATE_LABEL: ${{ steps.title.outputs.date_label }}
        run: |
          SYNC_LINE=$(FIRST="$SYNC_FIRST" NOW="$SYNC_NOW" COUNT="$SYNC_COUNT" MODE=line bash .github/scripts/build-sync-comment.sh)
          BLOCKS=$(printf '%s' "$BODY" | EXTRA_NOTE="$SYNC_LINE" bash .github/scripts/build-notion-blocks.sh)
          # 블록이 100개를 넘으면 나눠서 붙인다
          bash .github/scripts/append-notion-blocks.sh "$PAGE_ID" <<<"$BLOCKS"

      - name: 기존 본문 블록 삭제 (새 내용 쓰기 성공한 뒤에만)
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          while read -r BLOCK_ID; do
            [[ -z "$BLOCK_ID" ]] && continue
            curl -sS --fail --retry 3 --retry-delay 2 --max-time 15 \
              -X DELETE "https://api.notion.com/v1/blocks/$BLOCK_ID" \
              -H "Authorization: Bearer $NOTION_TOKEN" \
              -H "Notion-Version: 2022-06-28" > /dev/null
          done < /tmp/old_block_ids.txt

      - name: resync:재연동 라벨 제거
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token || secrets.GITHUB_TOKEN }}
          DISCUSSION_NODE_ID: ${{ github.event.discussion.node_id }}
          LABEL_NODE_ID: ${{ github.event.label.node_id }}
        run: |
          gh api graphql -f query="
            mutation {
              removeLabelsFromLabelable(input: {labelableId: \"$DISCUSSION_NODE_ID\", labelIds: [\"$LABEL_NODE_ID\"]}) {
                clientMutationId
              }
            }"

      - name: 연동 댓글에 재연동 시각 반영
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token || secrets.GITHUB_TOKEN }}
          DISCUSSION_NODE_ID: ${{ github.event.discussion.node_id }}
          COMMENT_ID: ${{ steps.find_page.outputs.comment_id }}
          COMMENT_AUTHOR: ${{ steps.find_page.outputs.comment_author }}
          PAGE_URL: ${{ steps.page.outputs.page_url }}
          SYNC_FIRST: ${{ steps.sync_meta.outputs.first }}
          SYNC_NOW: ${{ steps.sync_meta.outputs.now }}
          SYNC_COUNT: ${{ steps.sync_meta.outputs.count }}
        run: |
          COMMENT_BODY=$(PAGE_URL="$PAGE_URL" TARGET=디스커션 \
            FIRST="$SYNC_FIRST" NOW="$SYNC_NOW" COUNT="$SYNC_COUNT" \
            bash .github/scripts/build-sync-comment.sh)
          if [[ "$COMMENT_AUTHOR" == "monew-team03" ]] && gh api graphql -f query='
            mutation($id: ID!, $body: String!) {
              updateDiscussionComment(input: {commentId: $id, body: $body}) { comment { id } }
            }' -f id="$COMMENT_ID" -f body="$COMMENT_BODY"; then
            echo "연동 댓글을 고쳤습니다."
            exit 0
          fi
          echo "기존 연동 댓글을 고칠 수 없어 이어받은 댓글을 새로 답니다."
          gh api graphql -f query='
            mutation($discussionId: ID!, $body: String!) {
              addDiscussionComment(input: {discussionId: $discussionId, body: $body}) { comment { id } }
            }' -f discussionId="$DISCUSSION_NODE_ID" -f body="$COMMENT_BODY"
