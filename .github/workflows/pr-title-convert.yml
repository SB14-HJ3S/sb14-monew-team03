name: PR Title Convert

on:
  pull_request:
    types: [opened, edited, reopened]

permissions:
  pull-requests: write
  issues: read

jobs:
  convert-title:
    runs-on: ubuntu-latest
    steps:
      - name: Convert PR title to type-label format
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const title = context.payload.pull_request.title;

            // 전체 단어든 한 글자 단축키든 같은 [Type]으로 변환
            const map = {
              feat: "[Feat]", f: "[Feat]",
              fix: "[Fix]", x: "[Fix]",
              refactor: "[Refactor]", r: "[Refactor]",
              docs: "[Docs]", d: "[Docs]",
              chore: "[Chore]", c: "[Chore]",
              test: "[Test]", t: "[Test]",
              batch: "[Batch]", b: "[Batch]",
              deploy: "[Deploy]", y: "[Deploy]",
            };

            const emoji = {
              "[Feat]": "✨", "[Fix]": "🛠️", "[Refactor]": "♻️", "[Docs]": "🗂️",
              "[Chore]": "⚙️", "[Test]": "📝", "[Batch]": "⏰", "[Deploy]": "🚀",
            };
            const typed = (text) => text.match(/^(?:\p{Extended_Pictographic}️?\s*)?(\[(?:Feat|Fix|Refactor|Docs|Chore|Test|Batch|Deploy)\])([\s\S]*)$/u);
            const withEmoji = (m) => `${emoji[m[1]]} ${m[1]}${m[2]}`;

            const head = typed(title);
            if (!head && /\[(?:Feat|Fix|Refactor|Docs|Chore|Test|Batch|Deploy)\]/.test(title)) {
              core.setFailed(`[타입] 앞에 다른 글자가 있어 제목을 바꾸지 않았어요: "${title}"`);
              return;
            }
            if (head && withEmoji(head) === title) {
              console.log(`이미 변환된 제목입니다: "${title}"`);
              return;
            }

            // 콜론(:)은 한글 키보드에서 Shift가 필요해서 세미콜론(;)도 같이 허용
            const matched = title.match(/^(feat|fix|refactor|docs|chore|test|batch|deploy|f|x|r|d|c|t|b|y)\s*[:;]\s*(.+)$/);
            let newTitle;
            if (head) {
              newTitle = withEmoji(head);
            } else if (matched) {
              const [, type, description] = matched;
              // 커밋 메시지에서 온 제목이면 끝에 [#번호]가 붙어 있음 — PR 제목엔 이슈 번호를 안 넣으므로 뗌
              newTitle = `${emoji[map[type]]} ${map[type]} : ${description.replace(/\s*\[#\d+\]\s*$/, "")}`;
            } else {
              // 커밋이 2개 이상이면 GitHub이 브랜치 이름("Chore/999 commit practice")을 제목으로 채움 —
              // 브랜치({타입}/{이슈번호}-{키워드})의 이슈 번호로 이슈 제목을 가져와 PR 제목으로 쓴다
              const branch = context.payload.pull_request.head.ref;
              const issueNumber = (branch.match(/^[a-z]+\/(\d+)-/) || [])[1];
              let issueTitle = "";
              if (issueNumber) {
                try {
                  const { data: issue } = await github.rest.issues.get({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: Number(issueNumber),
                  });
                  issueTitle = issue.title;
                } catch (e) {
                  console.log(`이슈 #${issueNumber}를 찾지 못했습니다: ${e.message}`);
                }
              }
              const issueHead = typed(issueTitle);
              if (!issueHead) {
                core.setFailed(
                  `PR 제목 형식이 올바르지 않습니다: "${title}"\n` +
                  `예: feat: 관심사 등록 API 추가 (또는 단축키 f: 관심사 등록 API 추가)`
                );
                return;
              }
              newTitle = withEmoji(issueHead);
            }
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              title: newTitle,
            });
            console.log(`제목 변환: "${title}" → "${newTitle}"`);
