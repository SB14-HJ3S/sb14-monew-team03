name: Web Merge Commit Title

on:
  pull_request:
    types: [synchronize]
    branches: [develop]

permissions:
  contents: read
  pull-requests: write

jobs:
  retitle:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: web-merge-title-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: 웹에서 만든 develop 머지 커밋인지 확인
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          AFTER: ${{ github.event.after }}
        run: |
          INFO=$(gh api "repos/$REPO/commits/$AFTER" --jq '"\(.parents | length)\u001f\(.commit.committer.email)\u001f\(.commit.message | split("\n")[0])"') || exit 0
          IFS=$'\x1f' read -r NP EMAIL TITLE <<< "$INFO"
          if [ "$NP" -eq 2 ] && [ "$EMAIL" = "noreply@github.com" ] && [[ "$TITLE" == "Merge branch 'develop' into "* ]]; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 봇 토큰 발급
        id: bot
        if: steps.check.outputs.web == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.DISCUSSION_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DISCUSSION_BOT_PRIVATE_KEY }}

      - name: PR 브랜치 받기
        if: steps.check.outputs.web == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ steps.bot.outputs.token }}
          fetch-depth: 0

      - name: 커밋 제목을 팀 형식으로 바꿔 다시 올리기
        id: retitle
        if: steps.check.outputs.web == 'true'
        env:
          AFTER: ${{ github.event.after }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          [ "$(git rev-parse HEAD)" = "$AFTER" ] || { echo "그사이 새 커밋이 올라와서 건너뜁니다"; exit 0; }
          git log -1 --format=%B > "$RUNNER_TEMP/msg"
          sh .githooks/commit-msg "$RUNNER_TEMP/msg" || { echo "제목 변환에 실패해서 건너뜁니다"; exit 0; }
          git config user.name 'monew-team03[bot]'
          git config user.email '344808795+monew-team03[bot]@users.noreply.github.com'
          git commit --amend --no-verify -F "$RUNNER_TEMP/msg"
          git push --force-with-lease="refs/heads/$HEAD_REF:$AFTER" origin "HEAD:refs/heads/$HEAD_REF"
          echo "title=$(git log -1 --format=%s)" >> "$GITHUB_OUTPUT"

      - name: 안내 댓글
        if: steps.retitle.outputs.title != ''
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          TITLE: ${{ steps.retitle.outputs.title }}
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.payload.pull_request.number,
              body: [
                `GitHub 웹에서 만든 머지 커밋 제목을 \`${process.env.TITLE}\`로 바꿨어요`,
                '',
                '로컬에서 이 브랜치로 이어서 작업하기 전에 `git pull --rebase` 한 번 해 주세요',
                '다음부터 충돌은 웹 버튼 대신 로컬에서 `git merge origin/develop`으로 풀면 제목이 처음부터 팀 형식으로 들어가요',
              ].join('\n'),
            });
