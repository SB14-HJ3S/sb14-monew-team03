name: PR Auto Setup

# PR이 열리거나 고쳐지면
# 1) 담당자를 작성자로 지정 (열릴 때)
# 2) 제목의 타입(feat:·chore: 등)에 맞는 라벨을 붙임 — 타입을 바꾸면 타입 라벨만 교체, 다른 라벨은 그대로
# 3) 본문에 이슈 연결(close #번호)이 없으면 브랜치 이름의 이슈 번호로 넣어 줌 (main으로 가는 PR은 제외)
# 이슈 마감일은 issue-auto-setup.yml이 이슈가 닫힐 때 처리함

on:
  pull_request:
    types: [opened, edited]

permissions: {}

jobs:
  auto-setup:
    runs-on: ubuntu-latest
    concurrency:
      group: pr-auto-setup-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: 담당자를 작성자로 지정
        if: github.event.action == 'opened'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              assignees: [context.payload.pull_request.user.login],
            });

      - name: 제목의 "타입:" 접두사로 라벨 자동 설정(교체)
        if: ${{ !cancelled() }}
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            // context.payload는 이벤트 발생 시점에 고정된 스냅샷이라, opened 직후 바로
            // 제목을 고치면 edited 실행이 opened가 라벨을 추가하기 전의 옛날 데이터를 볼 수 있음
            // (concurrency는 "순서"만 보장하지, "최신 데이터"는 보장 안 함) — 그래서 실행 직전에
            // API로 최신 제목·라벨을 다시 조회함
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const title = pr.title || '';
            // pr-title-convert.yml이 먼저 실행돼서 제목이 이미 "✨ [Feat] : 설명"처럼
            // 변환돼 있을 수 있음(변환 워크플로가 GITHUB_TOKEN으로 제목을 바꾸면 그 이벤트는
            // 새 워크플로를 재트리거하지 않아서, 지금 이 실행이 변환 전/후 어느 쪽을 볼지 알 수 없음)
            // → 원본 형식("chore: 설명" 또는 단축키 "c: 설명")과 변환된 형식("🖍️ [Chore] : 설명") 둘 다 인식
            const raw = title.match(/^\s*(\w+)\s*[:;]/);   // 세미콜론(;)도 콜론과 동일하게 인식
            const bracket = title.match(/^[^\w\[]*\[([A-Za-z]+)\]\s*:/);   // 제목 맨 앞쪽만 인식(설명 속 괄호 오매칭 방지)
            const type = (raw ? raw[1] : bracket ? bracket[1] : '').toLowerCase();
            if (!type) return;

            const typeToLabel = {
              feat: 'feat:기능', f: 'feat:기능',
              fix: 'fix:수정', x: 'fix:수정',
              refactor: 'refactor:개선', r: 'refactor:개선',
              docs: 'docs:문서', d: 'docs:문서',
              chore: 'chore:설정', c: 'chore:설정',
              test: 'test:테스트', t: 'test:테스트',
              batch: 'batch:배치', b: 'batch:배치',
              deploy: 'deploy:배포', y: 'deploy:배포',
            };
            const typeLabels = new Set(Object.values(typeToLabel));
            const target = typeToLabel[type];
            if (!target) return;

            const current = pr.labels.map(l => l.name);

            // 타입 라벨끼리만 정리 — common/urgent/level:* 등 다른 라벨은 안 건드림
            // target이 이미 있어도 "다른" 타입 라벨이 같이 남아있으면 지워야 하므로
            // "이미 있으면 바로 끝" 하지 않고 항상 정리부터 함
            const stale = current.filter(l => typeLabels.has(l) && l !== target);
            for (const name of stale) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  name,
                });
              } catch (e) {
                if (e.status !== 404) throw e;   // 이미 다른 경로로 지워졌으면 무시
              }
            }

            if (!current.includes(target)) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: [target],
              });
            }


      - name: PR 본문에 이슈 연결 자동 추가
        if: ${{ !cancelled() }}
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            // 제목 변환·라벨 단계가 PR을 고쳤을 수 있어 최신 본문을 다시 조회
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            if (pr.base.ref === 'main') return;   // develop → main 릴리스 PR은 이슈 하나에 묶이지 않음

            const body = pr.body || '';
            if (/\b(close[sd]?|fix(e[sd])?|resolve[sd]?)\s+#\d+/i.test(body)) return;   // 이미 연결됨

            const issueNumber = (pr.head.ref.match(/^[a-z]+\/(\d+)-/) || [])[1];
            if (!issueNumber) {
              core.warning(`브랜치 이름(${pr.head.ref})에 이슈 번호가 없어 이슈 연결을 넣지 못했습니다. PR 본문에 "close #번호"를 직접 적어 주세요.`);
              return;
            }

            const line = `- close #${issueNumber}`;
            const placeholder = /^- close #이슈번호[ \t]*$/m;   // PR 템플릿의 빈 자리
            const newBody = placeholder.test(body) ? body.replace(placeholder, line) : `${line}\n\n${body}`;
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              body: newBody,
            });
            console.log(`PR 본문에 "${line}"을 넣었습니다.`);
