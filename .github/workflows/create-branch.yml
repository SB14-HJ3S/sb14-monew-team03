name: Auto Create Branch

# 이슈 본문의 Branch Keyword(영어)를 읽어 {타입}/{이슈번호}-{키워드} 브랜치를 자동으로 만든다
# 키워드가 없거나 라벨이 브랜치 타입이 아니면(질문·회의 등) 조용히 건너뜀
# 나중에 본문을 고쳐 키워드를 넣어도 만들어지게 edited에도 실행하고, 이미 있는 브랜치는 건너뜀
on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: read

jobs:
  create-feature-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Branch Keyword 추출
        id: extract_keyword
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const body = context.payload.issue.body || '';
            // "Branch Keyword" 헤딩(## 또는 ###, 이모지 유무 무관) 섹션부터 다음 헤딩 전까지를
            // 통째로 가져온 뒤, HTML 주석(여러 줄 포함, 안내 문구를 안 지우고 그 아래에 입력하는 게
            // 자연스러운 사용법)을 전부 제거하고 남은 줄 중 첫 번째 비어있지 않은 줄을 키워드로 사용
            const sectionMatch = body.match(/(?:^|\n)#{1,6}[^\n]*Branch Keyword[^\n]*\n([\s\S]*?)(?=\n#{1,6}\s|$)/);
            let keyword = '';
            if (sectionMatch) {
              const withoutComments = sectionMatch[1].replace(/<!--[\s\S]*?-->/g, '');
              const firstLine = withoutComments.split('\n').map(l => l.trim()).find(l => l.length > 0);
              keyword = firstLine || '';
            }
            core.setOutput('keyword', keyword);

      - name: Branch Keyword 없음 (스킵)
        if: steps.extract_keyword.outputs.keyword == ''
        run: echo "Branch Keyword가 비어있어 자동 브랜치 생성을 건너뜁니다. (GitHub 기본 'Create a branch' 버튼을 써도 됩니다)"

      - name: 라벨로 커밋 타입 결정
        if: steps.extract_keyword.outputs.keyword != ''
        id: set_type
        env:
          LABELS_JSON: ${{ toJson(github.event.issue.labels.*.name) }}
        run: |
          # 라벨 "이름:한글설명" 형식의 맨 앞부분만 정확히 비교(부분 문자열 매칭 아님) —
          # 예: wontfix:중단이 fix:수정으로 잘못 매칭되는 걸 방지
          TYPE=$(echo "$LABELS_JSON" | jq -r '
            map(ascii_downcase) as $labels |
            if any($labels[]; startswith("feat:")) then "feat"
            elif any($labels[]; startswith("fix:")) then "fix"
            elif any($labels[]; startswith("refactor:")) then "refactor"
            elif any($labels[]; startswith("docs:")) then "docs"
            elif any($labels[]; startswith("chore:")) then "chore"
            elif any($labels[]; startswith("test:")) then "test"
            elif any($labels[]; startswith("deploy:")) then "chore"
            elif any($labels[]; startswith("batch:")) then "batch"
            else ""
            end
          ')
          echo "type=$TYPE" >> "$GITHUB_OUTPUT"

      - name: 매핑되는 타입 없음 (스킵)
        if: steps.extract_keyword.outputs.keyword != '' && steps.set_type.outputs.type == ''
        run: echo "이 이슈의 라벨은 브랜치 타입으로 매핑되지 않아(질문/회의/ADR 등) 자동 생성을 건너뜁니다."

      - name: 키워드 정리 (영어/숫자/하이픈만, 소문자, 20자 제한)
        if: steps.extract_keyword.outputs.keyword != '' && steps.set_type.outputs.type != ''
        id: sanitize
        env:
          # 반드시 env로 전달 — run 스크립트에 ${{ }}로 직접 치환하면 이슈 작성자가
          # 키워드에 셸 특수문자를 넣어 임의 명령을 실행할 수 있음(스크립트 인젝션)
          RAW_KEYWORD: ${{ steps.extract_keyword.outputs.keyword }}
        run: |
          CLEAN=$(echo "$RAW_KEYWORD" \
            | iconv -f utf-8 -t ascii//TRANSLIT//IGNORE \
            | tr -cd '[:alnum:]-_' \
            | tr '[:upper:]' '[:lower:]' \
            | cut -c 1-20)
          echo "name=$CLEAN" >> "$GITHUB_OUTPUT"

      - name: "정리 후 빈 값 (스킵, 예: 한글만 입력한 경우)"
        if: steps.set_type.outputs.type != '' && steps.sanitize.outputs.name == ''
        run: echo "::warning::Branch Keyword가 영어/숫자로 변환되지 않아 자동 생성을 건너뜁니다. Branch Keyword는 영어로 적어주세요."

      - name: 브랜치 존재 여부 확인
        if: steps.sanitize.outputs.name != ''
        id: check_branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="${{ steps.set_type.outputs.type }}/${{ github.event.issue.number }}-${{ steps.sanitize.outputs.name }}"
          if gh api "repos/${{ github.repository }}/branches/$BRANCH_NAME" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 이미 브랜치 있음 (스킵)
        if: steps.check_branch.outputs.exists == 'true'
        run: echo "브랜치가 이미 존재해서 건너뜁니다 (opened 때 만들어졌거나, edited로 이미 한 번 생성됨)."

      - name: 브랜치 생성
        if: steps.sanitize.outputs.name != '' && steps.check_branch.outputs.exists == 'false'
        uses: peterjgrainger/action-create-branch@10c7d268152480ae859347db45dc69086cef1d9c # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          branch: ${{ steps.set_type.outputs.type }}/${{ github.event.issue.number }}-${{ steps.sanitize.outputs.name }}
