name: Validate Commit Issue Ref

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write   # 커밋 목록 조회 + 누락 알림 댓글 작성·삭제

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: PR의 모든 커밋에 [#이슈번호]가 있는지 확인 (경고만, PR을 막지 않음)
        id: issue-ref
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # merge 커밋(부모 2개 이상)은 빼고, 나머지 커밋을 한 줄씩(SHA + 제목) 모은다
          # 번호는 보통 commit-msg 훅이 브랜치명에서 자동으로 붙여주므로, 평소엔 이 검사에
          # 걸릴 일이 없음 — 훅이 안 깔린 PC, GitHub 웹 수정, --no-verify처럼 훅을 거치지
          # 않은 예외적인 경우의 안전망일 뿐이라, PR을 막으면 rebase/force-push가 필요해져서
          # 초보 팀원한텐 그게 더 위험함 — 경고로 낮춤
          COMMITS=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/commits" --paginate \
            --jq '.[] | select((.parents | length) < 2) | "\(.sha) \(.commit.message | split("\n")[0])"') || {
            echo "::warning::PR 커밋 목록을 가져오지 못해 이슈번호 검사를 건너뜁니다."
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          }

          MISSING=""
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            SHA="${line%% *}"
            TITLE="${line#* }"
            if ! printf '%s' "$TITLE" | grep -qE '\[#[0-9]+\]'; then
              MISSING="${MISSING}- \`${SHA:0:7}\` ${TITLE}"$'\n'
            fi
          done <<< "$COMMITS"

          if [ -n "$MISSING" ]; then
            echo "::warning::다음 커밋에 [#이슈번호]가 없습니다 — PR은 막히지 않지만, 브랜치명이 {타입}/{이슈번호}-{이름} 형식이면 commit-msg 훅이 자동으로 붙여주니 다음부터는 그 규칙으로 커밋해주세요:"
            printf '%s' "$MISSING"
            {
              echo "### ⚠️ 이슈번호 누락 커밋"
              printf '%s' "$MISSING"
            } >> "$GITHUB_STEP_SUMMARY"
            # Actions 화면·Checks 탭은 체크가 초록색이면 아무도 안 열어 봐서, PR 댓글로도 알림
            {
              echo "status=missing"
              echo "list<<MISSING_EOF"
              printf '%s' "$MISSING"
              echo "MISSING_EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "모든 커밋에 이슈번호가 있습니다."
          echo "status=ok" >> "$GITHUB_OUTPUT"
          exit 0

      - name: 이슈번호 누락 알림 댓글 (PR당 1개 고정, push할 때마다 내용 갱신)
        if: steps.issue-ref.outputs.status == 'missing'
        continue-on-error: true   # 포크 PR 등 토큰 권한이 부족해 실패해도 PR을 막지 않음
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2
        with:
          header: commit-issue-ref
          message: |
            ⚠️ **커밋 제목에 `[#이슈번호]`가 없는 커밋이 있어요** (PR은 막히지 않아요)

            ${{ steps.issue-ref.outputs.list }}

            브랜치명이 `{타입}/{이슈번호}-{이름}` 형식(예: `feat/26-user-signup`)이면 커밋할 때 훅이 번호를 자동으로 붙여 줘요. 다음 커밋부터 그 규칙으로 커밋해 주세요.

      - name: 이슈번호 누락 없음 (기존 알림 댓글 제거)
        if: steps.issue-ref.outputs.status == 'ok'
        continue-on-error: true   # 포크 PR 등 토큰 권한이 부족해 실패해도 PR을 막지 않음
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2
        with:
          header: commit-issue-ref
          delete: true
