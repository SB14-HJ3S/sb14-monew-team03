name: Troubleshooting Notion Audit
# 닫힌 fix 이슈·PR과 노션 "트래블 슈팅" DB를 비교해 빠진 카드·중복 카드를 찾는다 (중복은 보고만 함)
# 실행: Actions 탭 → "Troubleshooting Notion Audit" → Run workflow. 결과는 Summary에 표시
# "빠진 것 만들기"를 고르면 빠진 카드를 한 번에 최대 10장까지 만든다
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 보고만 할지, 빠진 것까지 만들지
        type: choice
        options:
          - 보고만
          - 빠진 것 만들기
        default: 보고만

permissions:
  contents: read
  issues: read
  pull-requests: read
  id-token: write # 글 작성 액션이 사용

# 해결 시점 동기화와 같은 그룹 — 동시에 돌면 같은 카드를 두 번 만들 수 있어서 하나씩 돌게 한다
concurrency:
  group: troubleshooting-notion-sync
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AUDIT_MODE: ${{ inputs.mode == '빠진 것 만들기' && 'create' || 'report' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: GitHub와 노션 비교
        id: audit
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_USER_MAP: ${{ vars.NOTION_USER_MAP }}
        with:
          script: |
            const { audit } = require('./.github/scripts/troubleshooting-notion.js');
            await audit({ github, context, core });

      - name: GitHub 연동으로 트러블슈팅 기록 작성
        id: write_a
        if: steps.audit.outputs.need_write == 'true'
        continue-on-error: true # 실패하면 다음 단계가 이슈·PR 원문으로 카드를 만든다
        uses: anthropics/claude-code-action@f27be6b65a4652f08a2ba3cff79114829b588967 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_B }}
          prompt: 저장소 루트의 ts-context.md를 읽고, 그 안의 안내대로 ts-written.json 파일 하나만 작성해 주세요.
          claude_args: '--allowedTools "Read,Write"'

      - name: 빠진 카드 노션에 만들기
        if: steps.audit.outputs.need_write == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_USER_MAP: ${{ vars.NOTION_USER_MAP }}
        with:
          script: |
            const { write } = require('./.github/scripts/troubleshooting-notion.js');
            await write({ github, context, core });
