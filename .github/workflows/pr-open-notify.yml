name: PR Open Notification (Channel)

on:
  pull_request:
    types: [opened]
    branches: [dev, develop, main]

permissions: {}

jobs:
  notify:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: 채널 알림 전송
        env:
          DISCORD_WEBHOOK_URL_PR_OPENED: ${{ secrets.DISCORD_WEBHOOK_URL_PR_OPENED }}
          DISCORD_WEBHOOK_URL_ALL: ${{ secrets.DISCORD_WEBHOOK_URL_ALL }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          PAYLOAD=$(jq -n \
            --arg title "📌 ${PR_TITLE}" \
            --arg url "$PR_URL" \
            --arg author "$PR_AUTHOR" \
            --arg branch "\`${HEAD_BRANCH}\` → \`${BASE_BRANCH}\`" \
            '{
              embeds: [{
                title: $title,
                url: $url,
                color: 3447003,
                fields: [
                  {name: "👤 작성자", value: $author, inline: true},
                  {name: "🌿 브랜치", value: $branch, inline: false}
                ],
                footer: {text: "MoNew Bot"}
              }]
            }')

          FAILED=0
          for WEBHOOK_URL in "$DISCORD_WEBHOOK_URL_PR_OPENED" "$DISCORD_WEBHOOK_URL_ALL"; do
            echo "$PAYLOAD" | curl -sS --fail --retry 3 --retry-delay 2 --max-time 15 -H "Content-Type: application/json" -d @- "$WEBHOOK_URL" || FAILED=1
          done
          exit $FAILED
