name: PR Labeler

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  issues: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 도메인 라벨 하나 붙이기
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const DOMAINS = {
              user: 'user:사용자',
              interest: 'interest:관심사',
              article: 'article:기사',
              comment: 'comment:댓글',
              notification: 'notification:알림',
              useractivity: 'useractivity:활동내역',
            };
            const OWNERS = {
              'Hanna-log': 'user',
              ssoomni52: 'interest',
              mjdevkim: 'article',
              swanhw: 'comment',
              lsc0869: 'notification',
            };
            const COMMON = 'common:공통';
            const pr = context.payload.pull_request;
            const labelNames = (labels) => labels.map((l) => (typeof l === 'string' ? l : l.name));

            const { data: current } = await github.rest.issues.get({ ...context.repo, issue_number: pr.number });
            const labels = labelNames(current.labels);
            if (labels.some((l) => Object.values(DOMAINS).includes(l))) {
              core.info('이미 도메인 라벨이 있어서 그대로 둬요');
              return;
            }
            if (labels.includes(COMMON)) {
              core.info('공통 작업 PR이라 도메인 라벨을 붙이지 않아요');
              return;
            }

            const branchIssue = (pr.head.ref.match(/^[a-z]+\/(\d+)-/) || [])[1];
            if (branchIssue) {
              try {
                const { data: issue } = await github.rest.issues.get({ ...context.repo, issue_number: Number(branchIssue) });
                if (labelNames(issue.labels).includes(COMMON)) {
                  core.info(`이슈 #${branchIssue}가 공통 작업이라 도메인 라벨을 붙이지 않아요`);
                  return;
                }
              } catch (e) {
                core.info(`이슈 #${branchIssue}를 찾지 못했어요: ${e.message}`);
              }
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const count = {};
            for (const { filename } of files) {
              const parts = filename.split('/');
              if (parts[0] !== 'src') continue;
              for (const d of new Set(parts.slice(1, -1).filter((p) => DOMAINS[p]))) {
                count[d] = (count[d] || 0) + 1;
              }
            }

            const top = Math.max(0, ...Object.values(count));
            if (top === 0) {
              core.info('도메인 폴더를 바꾸지 않아서 라벨을 붙이지 않아요');
              return;
            }
            const tied = Object.keys(count).filter((d) => count[d] === top);
            const author = OWNERS[pr.user.login];
            const pick = tied.length === 1 ? tied[0] : tied.includes(author) ? author : null;
            if (!pick) {
              core.info(`바뀐 파일 수가 같은 도메인이 여러 개라 붙이지 않아요: ${tied.join(', ')}`);
              return;
            }
            await github.rest.issues.addLabels({ ...context.repo, issue_number: pr.number, labels: [DOMAINS[pick]] });
            core.info(`${DOMAINS[pick]} 라벨을 붙였어요 (바뀐 파일 ${top}개)`);
