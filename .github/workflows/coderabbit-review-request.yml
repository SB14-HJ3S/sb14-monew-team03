name: CodeRabbit Review Request

# 팀원이 올린 PR에도 CodeRabbit 리뷰가 돌게 `@coderabbitai review` 댓글을 자동으로 남긴다 (#141)
# - 저장소가 공개 + 별 10개 미만이라 CodeRabbit이 팀원 PR은 자동 리뷰를 건너뛴다
#   ("This repository does not receive automatic reviews because it has fewer than 10 stars.")
# - CodeRabbit을 연결한 계정(SKIP_AUTHORS)의 PR은 원래 자동 리뷰되므로 건너뛴다 — 두 번 돌면 시간당 무료 한도를 빨리 씀
# - Draft PR은 건너뛰고, Ready로 바뀔 때 요청한다
on:
  pull_request:
    types: [opened, ready_for_review]

permissions: {}   # 필요한 권한은 job 단위로만 부여

jobs:
  request-review:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: "@coderabbitai review 댓글 남기기"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          SKIP_AUTHORS: Hanna-log   # CodeRabbit 연결 계정 — 여러 명이면 공백으로 구분
        run: |
          for skip in $SKIP_AUTHORS; do
            if [ "$PR_AUTHOR" = "$skip" ]; then
              echo "CodeRabbit 연결 계정($PR_AUTHOR)의 PR은 자동 리뷰되므로 건너뜀"
              exit 0
            fi
          done
          gh pr comment "$PR_NUMBER" --body "@coderabbitai review"
