name: CI

on:
  # PR은 항상 CI를 돌린다 — 아예 안 돌면 필수 체크(build)가 계속 "대기"라 머지가 막힘
  # 문서·프론트 파일만 바뀐 PR은 아래 changes job이 골라내 build만 건너뜀 (건너뛴 건 통과로 처리됨)
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]   # 머지된 뒤 커버리지 뱃지를 갱신하기 위한 트리거 (PR 중에는 뱃지 커밋 안 함)
    # 문서만 바뀐 머지는 CI·배포를 아예 안 돌림
    # 프론트 파일(static/)은 화면에 쓰여서 바뀌면 배포해야 하므로 여기 넣지 않음
    paths-ignore:
      - '**.md'
      - 'docs/**'

# PR에 새로 push하면 전에 돌던 CI는 취소하고 최신 커밋만 검사한다
# develop 머지 후 CI는 배지·배포와 이어져 있어서 취소하지 않는다
concurrency:
  group: ci-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write    # Checkstyle 안내 댓글 작성에 필요
  checks: write           # Checkstyle 결과를 PR 댓글 대신 Checks 탭 알림으로 남기려면 필요 (github-pr-check 리포터)

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: 코드 변경 여부 확인 (문서·프론트 정적 파일만 바뀐 PR이면 빌드 생략)
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # push는 이미 on.push.paths-ignore로 걸러져서 여기까지 왔으면 코드가 바뀐 것
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 목록 조회에 실패하면 안전하게 빌드를 돌린다. 이름만 바꾼 파일은 이전 경로도 같이 검사한다
          # (코드 파일을 docs/나 .md로 옮기기만 한 PR이 빌드 없이 통과되지 않게)
          FILES=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)') || {
            echo "::warning::PR 변경 파일 목록을 가져오지 못해 빌드를 그대로 실행합니다."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          }

          # 제외 대상은 on.push.paths-ignore와 같다: *.md, docs/, src/main/resources/static/
          CODE_FILES=$(printf '%s\n' "$FILES" | grep -vE '\.md$|^docs/|^src/main/resources/static/' || true)
          if [ -n "$CODE_FILES" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "::notice::문서·프론트 정적 파일만 바뀐 PR이라 빌드를 건너뜁니다. 필수 체크는 통과로 표시됩니다."
          fi

  build:
    needs: changes
    # changes job이 고장 나도 빌드는 돌린다 — 안 그러면 테스트를 한 번도 안 돌린 PR이 통과로 머지될 수 있음
    if: ${{ !cancelled() && (needs.changes.result == 'failure' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # PR에서 바뀐 줄의 Checkstyle 위반만 세려면 base 브랜치와 비교해야 해서 기록을 전부 받음
          fetch-depth: 0

      - name: JDK 17 설정
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'   # 의존성·Gradle 배포판을 실행 간 재사용해서 매번 다시 내려받지 않음

      - name: Gradle 실행 권한 부여
        run: chmod +x gradlew

      - name: 빌드 및 테스트
        run: ./gradlew build

      - name: 실패한 테스트 이름 표시
        id: junit
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        with:
          report_paths: 'build/test-results/test/TEST-*.xml'
          check_name: '테스트 결과'
          include_passed: false
          detailed_summary: true

      - name: 테스트 결과 알림 댓글 (PR당 1개, 수정 방식)
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.junit.outputs.total != '' && steps.junit.outputs.total != '0' }}
        continue-on-error: true
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          FAILED: ${{ steps.junit.outputs.failed }}
          TOTAL: ${{ steps.junit.outputs.total }}
          DETAIL: ${{ steps.junit.outputs.detailed_summary }}
          REPORT_URL: ${{ steps.junit.outputs.report_url }}
        with:
          script: |
            const { upsertNotice } = require('./.github/scripts/pr-notice.js');
            const failed = Number(process.env.FAILED || 0);
            await upsertNotice({ github, context }, {
              marker: '<!-- test-result-notice -->',
              problem: failed > 0,
              problemBody: [
                `### ❌ 테스트 실패 ${failed}건 (전체 ${process.env.TOTAL}개)`,
                '',
                process.env.DETAIL || '',
                '',
                `[자세히 보기](${process.env.REPORT_URL})`,
              ].join('\n'),
              okBody: `### ✅ 테스트 모두 통과 (전체 ${process.env.TOTAL}개)`,
            });

      - name: 테스트 커버리지 알림 댓글 (본 코드가 바뀐 PR만)
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          BASE_REF: ${{ github.base_ref }}
        with:
          script: |
            const { coverageNotice } = require('./.github/scripts/pr-notice.js');
            await coverageNotice({ github, context, core });

      - name: 패키지 규칙 검사 (경고만)
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        continue-on-error: true
        run: ./gradlew archTest

      - name: 패키지 규칙 위반 경고·알림 댓글
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { archNotice } = require('./.github/scripts/pr-notice.js');
            await archNotice({ github, context, core });

      - name: 테스트 실패 시 테스트 리포트 첨부
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-report
          path: build/reports/tests/test/
          retention-days: 7

      - name: reviewdog CLI 설치
        if: github.event_name == 'pull_request'
        uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f # v1

      - name: Checkstyle 결과를 Checks 탭에 표시 (위반 있을 때만)
        if: github.event_name == 'pull_request'
        continue-on-error: true   # 보조 기능이라 reviewdog 자체가 실패해도 CI 전체를 빨갛게 만들지 않음
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # 본 코드·테스트 코드 결과는 이름을 나눠 올린다. 같은 이름이면 뒤에 올린 결과가 앞의 결과를 덮어씀 (#135)
        run: |
          reviewdog -f=checkstyle -name=checkstyle-main -reporter=github-pr-check -fail-level=none \
            < build/reports/checkstyle/main.xml
          reviewdog -f=checkstyle -name=checkstyle-test -reporter=github-pr-check -fail-level=none \
            < build/reports/checkstyle/test.xml

      # pr_count: 이 PR에서 추가·수정한 줄에 걸린 위반 (reviewdog가 Checks 탭에 표시하는 기준과 같음)
      # total: 프로젝트 전체 위반 (PR과 무관하게 이미 쌓여 있던 것 포함)
      # 알림 댓글 본문(checkstyle-comment.md)도 같이 만든다 — 위반 위치 표 + 기존 위반 접기 표 (#135)
      - name: Checkstyle 위반 개수 집계 및 알림 댓글 본문 만들기
        id: checkstyle-count
        if: github.event_name == 'pull_request'
        continue-on-error: true   # 보조 기능이라 실패해도 후속 단계를 막지 않음
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # core.quotePath=false: 한글 경로를 "\355…"처럼 바꾸지 않고 그대로 쓴다 (#135)
          git -c core.quotePath=false diff -U0 --no-color "origin/$BASE_REF...HEAD" > pr.diff
          python3 .github/scripts/checkstyle-report.py >> "$GITHUB_OUTPUT"

      - name: Checkstyle 위반 알림 댓글 (PR당 1개, 수정 방식)
        if: github.event_name == 'pull_request' && steps.checkstyle-count.outputs.pr_count != ''
        continue-on-error: true
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR_COUNT: ${{ steps.checkstyle-count.outputs.pr_count }}
        with:
          script: |
            const fs = require('fs');
            const { upsertNotice } = require('./.github/scripts/pr-notice.js');
            const count = Number(process.env.PR_COUNT || 0);
            await upsertNotice({ github, context }, {
              marker: '<!-- checkstyle-notice -->',
              legacyMarkers: ['Sticky Pull Request Commentcheckstyle-notice'],
              problem: count > 0,
              problemBody: count > 0 ? fs.readFileSync('checkstyle-comment.md', 'utf8') : '',
              okBody: '### ✅ 이 PR에서 생긴 Checkstyle 위반 없어요',
            });

      # Codecov는 외부 서비스라 토큰 누락·장애로 실패해도 CI(그리고 CI 성공이 조건인 배포)를 막지 않는다.
      # 업로드를 건너뛰고 경고만 남긴다
      - name: Codecov 업로드 토큰 확인
        id: codecov-token
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -z "$CODECOV_TOKEN" ]; then
            echo "::warning::저장소 Actions 시크릿에 CODECOV_TOKEN이 없어 커버리지 업로드를 건너뜁니다."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: JaCoCo XML을 Codecov에 업로드
        if: steps.codecov-token.outputs.present == 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/reports/jacoco/test/jacocoTestReport.xml
          disable_search: true
          fail_ci_if_error: false

  badge:
    # 취소된 빌드도 회색으로 표시한다. 실패·취소 결과를 반영하기 위해 always()를 유지한다.
    needs: build
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: readme-badges-${{ github.repository }}
      cancel-in-progress: false

    # 배지 그림은 develop이 아니라 배지 전용 브랜치(codecov-badge)에 커밋한다 — develop·main은 Ruleset으로
    # 직접 push가 막혀 있고, develop 기록에 배지 갱신 커밋이 섞이지도 않게 하기 위함
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: develop

      - name: 최신 코드의 실행인지 확인
        id: latest
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          # 이전 실행이 늦게 끝나 최신 결과를 덮지 않도록, develop 최신 커밋의 실행일 때만 갱신한다
          if [ "$TARGET_SHA" = "$(git rev-parse HEAD)" ]; then
            echo "update=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 배지 전용 브랜치 체크아웃
        if: steps.latest.outputs.update == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: codecov-badge
          path: _badges

      - name: 실제 CI 결과와 Codecov 수치로 배지 생성
        if: steps.latest.outputs.update == 'true'
        env:
          CI_RESULT: ${{ needs.build.result }}
          CODECOV_API_TOKEN: ${{ secrets.CODECOV_API_TOKEN }}
          COVERAGE_SHA: ${{ github.sha }}
          BADGE_DIR: _badges
        run: python3 .github/scripts/update-badges.py

      - name: 배지 변경사항 커밋 (codecov-badge 브랜치)
        if: steps.latest.outputs.update == 'true'
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5
        with:
          repository: _badges
          branch: codecov-badge
          commit_message: "chore : CI·Codecov 배지 갱신 [skip ci]"
          file_pattern: ci.svg codecov.svg
