name: Build Monitoring Images

on:
  push:
    branches: [ develop ]
    paths:
      - 'monitoring/**'
      - '.github/workflows/monitoring-images.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: monitoring-images
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: prometheus
            repository: monew-prometheus
            service: monew-prometheus-service
          - name: grafana
            repository: monew-grafana
            service: monew-grafana-service
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Build and push image
        id: build
        env:
          IMAGE: ${{ steps.login-ecr.outputs.registry }}/${{ matrix.repository }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # 같은 커밋을 다시 실행하면 이미 올린 이미지를 그대로 쓴다 (태그 불변이라 다시 push하면 실패)
          if aws ecr describe-images --repository-name "${{ matrix.repository }}" \
              --image-ids imageTag="$IMAGE_TAG" > /dev/null 2>&1; then
            echo "이미지 $IMAGE_TAG 가 ECR에 이미 있어서 빌드·push를 건너뜁니다."
          else
            docker build -t "$IMAGE:$IMAGE_TAG" "monitoring/${{ matrix.name }}"
            docker push "$IMAGE:$IMAGE_TAG"
          fi
          echo "image=$IMAGE:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      # 패밀리 최신 버전이 아니라 서비스가 지금 쓰는 버전을 기준으로 해서 이미지만 바뀌게 한다
      - name: Download current task definition
        env:
          ECS_SERVICE: ${{ matrix.service }}
        run: |
          TASK_DEF_ARN=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' --output text)
          aws ecs describe-task-definition \
            --task-definition "$TASK_DEF_ARN" \
            --query taskDefinition \
            > task-definition.json

      - name: Fill in new image in task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@8d79160660ad39c402a16e5fc7cd2a32e8f7d6b7 # v1
        with:
          task-definition: task-definition.json
          container-name: ${{ matrix.name }}
          image: ${{ steps.build.outputs.image }}

      # 서비스가 꺼져 있으면(실행 개수 0) 새 버전만 연결되고 태스크는 뜨지 않는다. 다음에 켤 때 이 이미지로 뜬다
      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@a00d4d57ac0de1a99b39fe469f3d898d38717c2b # v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ matrix.service }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
