name: Build Monitoring Images

on:
  push:
    branches: [ develop ]
    paths:
      - 'monitoring/**'
      - '.github/workflows/monitoring-images.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: monitoring-images
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: prometheus
            repository: monew-prometheus
            service: monew-prometheus-service
          - name: grafana
            repository: monew-grafana
            service: monew-grafana-service
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Build and push image
        env:
          IMAGE: ${{ steps.login-ecr.outputs.registry }}/${{ matrix.repository }}
        run: |
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" "monitoring/${{ matrix.name }}"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Redeploy service if running
        run: |
          DESIRED=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "${{ matrix.service }}" \
            --query 'services[0].desiredCount' --output text)
          if [ "$DESIRED" = "0" ] || [ "$DESIRED" = "None" ]; then
            echo "::notice::${{ matrix.service }}가 꺼져 있어 다시 띄우지 않습니다."
            exit 0
          fi
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "${{ matrix.service }}" \
            --force-new-deployment > /dev/null
